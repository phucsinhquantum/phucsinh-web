<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>html{background:#06080a}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khuyến mãi · Phúc Sinh QuanTum</title>
<meta name="description" content="Chương trình khuyến mãi đang diễn ra tại Phúc Sinh QuanTum: mã giảm giá, ưu đãi theo đợt.">
<meta name="theme-color" content="#06080a">
<link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="img/icon-512.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PSQ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=20261028k">
<script src="js/lang.js?v=20261028k"></script>
<style>
  .pm-hero { position: relative; overflow: hidden; display: flex; gap: 16px; align-items: center; padding: 22px 24px; }
  .pm-hero h2 { font-family: 'Cormorant Garamond', serif; font-size: 34px; margin: 2px 0 6px; }
  .pm-hero .eyebrow { color: #ff9a3d; }
  .pm-fire { flex: none; width: 64px; height: 64px; border-radius: 18px; background: radial-gradient(circle at 50% 70%, #ffd27a, #ff7a3d 55%, #c62828); box-shadow: 0 0 30px -4px rgba(255, 120, 60, .9); animation: promoGlowBox 1.8s ease-in-out infinite; }
  @keyframes promoGlowBox { 50% { box-shadow: 0 0 46px 2px rgba(255, 140, 60, 1); } }
  .pm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .pm-card { border-color: color-mix(in srgb, var(--c) 55%, transparent); box-shadow: 0 0 24px -10px var(--c); display: flex; flex-direction: column; gap: 8px; }
  .pm-card h3 { font-size: 19px; margin: 4px 0 0; }
  .pm-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .pm-hot { color: #fff; background: linear-gradient(135deg, #ff5f6d, #ff9a3d); border: 0; }
  .pm-hot svg { width: 13px; height: 13px; }
  .pm-desc { color: var(--text-2); font-size: 14px; white-space: pre-line; margin: 0; }
  .pm-code { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px dashed var(--c); background: color-mix(in srgb, var(--c) 8%, transparent); margin-top: auto; }
  .pm-code > div { flex: 1; min-width: 0; } .pm-code small { display: block; font-size: 11px; color: var(--text-3); }
  .pm-code b { display: block; font-size: 20px; letter-spacing: 1.5px; color: var(--c); } .pm-code span { font-size: 12.5px; color: var(--text-2); }
  @media (max-width: 560px) { .pm-hero { flex-direction: column; align-items: flex-start; padding: 18px; } .pm-hero h2 { font-size: 28px; } .pm-grid { grid-template-columns: 1fr; } }
  html.reduce-motion .pm-fire { animation: none; }
</style>
</head>
<body data-page="promo">
<div id="page" data-title="Chương trình khuyến mãi" data-crumb="Khuyến mãi">
  <section class="pm-hero card glow-gold">
    <span class="pm-fire" aria-hidden="true"></span>
    <div><span class="eyebrow">Ưu đãi từ Phúc Sinh QuanTum</span><h2>Chương trình khuyến mãi</h2>
      <p class="dim">Nhập mã ở ô "Mã giảm giá / mã khuyến mãi" khi đặt hàng. Mỗi đơn dùng 1 mã, không cộng dồn với chương trình khác.</p></div>
  </section>
  <section class="mt-3" id="pmList"></section>
</div>

<script src="js/patch.js?v=20261028k"></script>
<script src="js/api.js?v=20261028k"></script>
<script src="js/data.js?v=20261028k"></script>
<script src="js/app.js?v=20261028k"></script>
<script>
(function () {
  const { $, esc, icon, toast, money, fdate } = PSQ;
  const off = p => p.type === 'pct' ? `Giảm ${+p.value || 0}%${+p.maxOff ? ' (tối đa ' + money(+p.maxOff) + ')' : ''}` : p.type === 'amt' ? `Giảm ${money(+p.value || 0)}` : '';
  const when = p => p.start && p.end ? `Từ ${fdate(p.start)} đến ${fdate(p.end)}` : p.end ? `Đến hết ${fdate(p.end)}` : p.start ? `Từ ${fdate(p.start)}` : 'Đang diễn ra';
  const list = PSQ.promos();
  $('#pmList').innerHTML = list.length ? `<div class="pm-grid">${list.map(p => `<article class="card pm-card" style="--c:${esc(p.color || '#ff9a3d')}">
      <div class="pm-top"><span class="badge pm-hot">${icon('fire')} Đang diễn ra</span><small class="dim">${esc(when(p))}</small></div>
      <h3>${esc(p.title)}</h3>
      ${p.desc ? `<p class="pm-desc">${esc(p.desc)}</p>` : ''}
      ${p.code ? `<div class="pm-code"><div><small>Mã khuyến mãi</small><b>${esc(String(p.code).toUpperCase())}</b><span>${esc(off(p))}${+p.minOrder ? ' · đơn từ ' + money(+p.minOrder) : ''}</span></div><button class="btn btn-sm" type="button" data-copy="${esc(String(p.code).toUpperCase())}">${icon('copy')} Sao chép</button></div>` : ''}
      <div class="row mt-2" style="gap:8px;flex-wrap:wrap"><a class="btn btn-gold" href="${esc(p.link || 'san-pham.html')}">${icon('cart')} Mua ngay</a></div>
    </article>`).join('')}</div>`
    : `<div class="card empty" style="padding:40px 16px">${icon('gift')}<p>Hiện chưa có chương trình khuyến mãi. Anh chị quay lại sau nhé.</p><a class="btn btn-outline-gold mt-2" href="san-pham.html">Xem sản phẩm</a></div>`;
  $('#pmList').addEventListener('click', e => { const b = e.target.closest('[data-copy]'); if (!b) return; navigator.clipboard && navigator.clipboard.writeText(b.dataset.copy).catch(() => {}); toast('Đã sao chép mã ' + b.dataset.copy + ', dán vào ô mã khi đặt hàng'); });
})();
</script>
</body>
</html>
