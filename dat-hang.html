<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>html{background:#06080a}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đặt hàng · Phúc Sinh QuanTum</title>
<meta name="description" content="Đặt hàng trầm hương Phúc Sinh QuanTum: kiểm tra giỏ hàng, nhập thông tin giao hàng, chọn thanh toán bằng ví hoặc chuyển khoản.">
<meta name="theme-color" content="#06080a">
<link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="img/icon-512.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script src="js/lang.js"></script>
<style>
  .steps { display: flex; align-items: center; gap: 10px; padding: 16px 20px; }
  .step { display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 0; color: var(--text-3); text-align: left; cursor: default; }
  .step .n { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; font-weight: 700; font-size: 14px; border: 1px solid var(--line-2); background: rgba(0, 0, 0, .25); transition: all .3s; }
  .step .n svg { width: 16px; height: 16px; }
  .step b { display: block; font-size: 14px; font-weight: 600; color: inherit; }
  .step small { display: block; font-size: 12px; color: var(--text-3); }
  .step.on { color: var(--gold); }
  .step.on .n { color: #1d1507; background: linear-gradient(135deg, #ffe09a, var(--gold) 45%, var(--gold-2)); border-color: transparent; box-shadow: 0 0 18px -2px var(--gold-glow); }
  .step.done { color: var(--text); cursor: pointer; }
  .step.done .n { color: var(--cyan); border-color: rgba(79, 230, 223, .5); background: rgba(79, 230, 223, .1); box-shadow: 0 0 14px -4px var(--cyan-glow); }
  .step-line { flex: 1; height: 1px; min-width: 16px; background: var(--line-2); position: relative; overflow: hidden; }
  .step-line.done { background: linear-gradient(90deg, var(--cyan), var(--gold)); box-shadow: 0 0 8px var(--cyan-glow); }
  .co { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
  .co-side { position: sticky; top: calc(var(--top-h) + 4px); display: grid; gap: 18px; }
  .co-main h2.display { font-size: clamp(26px, 2.6vw, 34px); }
  .lines { display: grid; }
  .line { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto auto; gap: 16px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line); }
  .line:first-child { padding-top: 4px; }
  .line .cart-thumb { width: 76px; height: 76px; }
  .line .cart-thumb svg { width: 62px; height: 62px; }
  .line h3 { font-size: 15px; line-height: 1.4; }
  .line h3 a:hover { color: var(--gold); }
  .line .meta { font-size: 13px; color: var(--text-2); }
  .line .qty { margin: 0; }
  .line .qty button { width: 34px; height: 34px; }
  .line .sum { text-align: right; min-width: 110px; }
  .line .sum b { display: block; color: var(--gold); font-size: 15px; }
  .line .link-btn { margin-top: 4px; display: inline-flex; align-items: center; gap: 4px; }
  .line .link-btn svg { width: 13px; height: 13px; }
  .totals { display: grid; gap: 10px; font-size: 14px; }
  .totals .row { justify-content: space-between; }
  .totals .grand { font-size: 15px; padding-top: 12px; border-top: 1px solid var(--line); }
  .totals .grand b { font-size: 22px; color: var(--gold); text-shadow: 0 0 20px rgba(243, 199, 107, .3); }
  .nav-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; margin-top: 22px; }
  .field .err { font-size: 12px; color: var(--red); min-height: 0; }
  .field.bad .input { border-color: rgba(255, 107, 107, .6); box-shadow: 0 0 0 3px rgba(255, 107, 107, .1); }
  .req { color: var(--gold); }
  .choice label { align-items: flex-start; }
  .choice label input { margin-top: 4px; }
  .choice .c-ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: none; background: rgba(243, 199, 107, .1); color: var(--gold); border: 1px solid rgba(243, 199, 107, .25); }
  .choice b { display: block; font-size: 14px; color: var(--text); }
  .choice small { display: block; font-size: 12px; color: var(--text-3); }
  .bank { margin-top: 10px; padding: 14px 16px; border-radius: 12px; border: 1px dashed rgba(79, 230, 223, .4); background: rgba(79, 230, 223, .05); }
  .bank[hidden] { display: none; }
  .bank .kv { font-size: 13px; }
  .sum-items { display: grid; gap: 12px; max-height: 340px; overflow-y: auto; margin: 0 -4px; padding: 0 4px; scrollbar-width: thin; }
  .sum-item { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; font-size: 13px; }
  .sum-item .cart-thumb { width: 52px; height: 52px; border-radius: 10px; position: relative; }
  .sum-item .cart-thumb svg { width: 42px; height: 42px; }
  .sum-item .cart-thumb i { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--gold); color: #1a1408; font: 700 11px/20px var(--sans); text-align: center; font-style: normal; }
  .sum-item b { font-weight: 500; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .pts-note { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: rgba(79, 230, 223, .06); border: 1px solid rgba(79, 230, 223, .22); font-size: 13px; color: var(--text-2); }
  .pts-note svg { color: var(--cyan); }
  .pts-note b { color: var(--cyan); }
  .review { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .review .box { padding: 16px; border-radius: 14px; background: rgba(0, 0, 0, .22); border: 1px solid var(--line); }
  .review .box h4 { font-size: 13px; color: var(--text-3); font-weight: 500; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .review .box h4 .link-btn { margin-left: auto; color: var(--cyan); }
  .review .kv { font-size: 14px; }
  .success { text-align: center; padding: clamp(28px, 5vw, 48px) clamp(18px, 4vw, 40px); }
  .success .ok-ico { width: 76px; height: 76px; margin: 0 auto 18px; border-radius: 50%; display: grid; place-items: center; color: var(--green); background: rgba(69, 224, 143, .1); border: 1px solid rgba(69, 224, 143, .45); box-shadow: 0 0 40px -6px rgba(69, 224, 143, .5); }
  .success .ok-ico svg { width: 34px; height: 34px; }
  .success .oid { font-family: var(--display); font-size: clamp(34px, 4vw, 48px); color: var(--gold); letter-spacing: .04em; line-height: 1.1; }
  .success .info { max-width: 520px; margin: 22px auto 0; text-align: left; }
  .success .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 26px; }
  .lookup-res { margin-top: 14px; }
  .lookup-res:empty { display: none; }
  .lookup-res .box { padding: 14px; border-radius: 12px; background: rgba(0, 0, 0, .22); border: 1px solid var(--line); display: grid; gap: 8px; font-size: 13px; }
  .lookup-res .box .row { justify-content: space-between; }
  @media (max-width: 1099px) {
    .co { grid-template-columns: 1fr; }
    .co-side { position: static; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
  }
  @media (max-width: 699px) {
    .steps { padding: 14px; gap: 8px; align-items: flex-start; }
    .step { flex-direction: column; gap: 6px; text-align: center; flex: none; width: 74px; }
    .step b { font-size: 12px; line-height: 1.3; }
    .step small { display: none; }
    .step-line { margin-top: 18px; min-width: 8px; }
    .co-side { grid-template-columns: 1fr; }
    .line { grid-template-columns: 64px minmax(0, 1fr) auto; grid-template-areas: "t n n" "t q s"; gap: 6px 12px; }
    .line .cart-thumb { grid-area: t; width: 64px; height: 64px; align-self: start; }
    .line .cart-thumb svg { width: 52px; height: 52px; }
    .line > .nm { grid-area: n; }
    .line > .qty { grid-area: q; justify-self: start; }
    .line > .sum { grid-area: s; min-width: 0; }
    .review { grid-template-columns: 1fr; }
    .nav-btns .btn { flex: 1 1 100%; }
    .nav-btns .btn-gold { order: -1; }
  }
</style>
</head>
<body data-page="order">
<div id="page" data-title="Đặt hàng" data-crumb="Đặt hàng">
  <section class="card glow-mix steps reveal" id="steps" aria-label="Các bước đặt hàng"></section>
  <section class="co mt-3">
    <div class="co-main" id="main"></div>
    <aside class="co-side">
      <div class="card glow-gold" id="summary" aria-live="polite"></div>
      <div class="card glow-cyan">
        <div class="card-head"><span class="stat-ico"></span><div><h3>Tra cứu đơn hàng</h3><div class="sub">Nhập mã đơn và số điện thoại đặt hàng</div></div></div>
        <form id="lookup" class="stack" style="gap:10px" novalidate>
          <input class="input" name="oid" placeholder="Mã đơn, ví dụ PSQ1100" autocomplete="off" aria-label="Mã đơn hàng">
          <input class="input" name="phone" type="tel" inputmode="tel" placeholder="Số điện thoại" aria-label="Số điện thoại">
          <button class="btn btn-outline-gold btn-block" type="submit">Tra cứu</button>
        </form>
        <div class="lookup-res" id="lookupRes"></div>
      </div>
    </aside>
  </section>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/psq-data.js"></script>
<script>
(function () {
  const { $, $$, esc, money, icon, art, cart, product, auth, toast, statusBadge, fdate } = PSQ;
  const S = SITE, rate = S.pointRate || .1, ship = S.shipFee || 0;
  const PROVINCES = ['Hà Nội', 'TP. Hồ Chí Minh', 'Hải Phòng', 'Đà Nẵng', 'Huế', 'Cần Thơ', 'An Giang', 'Bắc Ninh', 'Cà Mau', 'Cao Bằng', 'Đắk Lắk', 'Điện Biên', 'Đồng Nai', 'Đồng Tháp', 'Gia Lai', 'Hà Tĩnh', 'Hưng Yên', 'Khánh Hòa', 'Lai Châu', 'Lâm Đồng', 'Lạng Sơn', 'Lào Cai', 'Nghệ An', 'Ninh Bình', 'Phú Thọ', 'Quảng Ngãi', 'Quảng Ninh', 'Quảng Trị', 'Sơn La', 'Tây Ninh', 'Thái Nguyên', 'Thanh Hóa', 'Tuyên Quang', 'Vĩnh Long'];
  const STEPS = [['Giỏ hàng', 'Kiểm tra sản phẩm'], ['Thông tin giao hàng', 'Địa chỉ và thanh toán'], ['Xác nhận', 'Xem lại và đặt hàng']];
  const normPhone = s => String(s || '').replace(/[\s.\-()]/g, '').replace(/^\+84/, '0');
  const pts = n => money(n * rate).replace('đ', '');
  const u = auth.user();
  const form = { name: u?.name || '', phone: u?.phone || '', email: u?.email || '', province: PROVINCES.includes(u?.city) ? u.city : '', address: '', note: '', pay: '' };
  let step = 0, placed = null;
  // ví điểm mua hàng (1 PS = 1đ) cho thành viên đã đăng nhập
  const PS = n => money(n).replace('đ', ' PS');
  const shopBal = () => { if (!u || !window.ADB) return 0; try { return ADB.balances(ADB.load(), u.id).shop || 0; } catch (e) { return 0; } };
  // thanh toán bằng ví: trừ ví điểm mua hàng trước, thiếu thì trừ ví tiền mặt
  const cashBal = () => { if (!u || !window.ADB) return 0; try { return ADB.balances(ADB.load(), u.id).cash || 0; } catch (e) { return 0; } };
  const due = () => cart.total() + ship;
  const walletBal = () => shopBal() + cashBal();
  const walletOk = () => !!u && walletBal() >= due();
  const payUsed = () => form.pay === 'wallet' ? Math.min(shopBal(), due()) : 0;
  const cashUsed = () => form.pay === 'wallet' ? Math.min(cashBal(), due() - payUsed()) : 0;

  $('#lookup').closest('.card').querySelector('.stat-ico').innerHTML = icon('search');

  function renderSteps() {
    $('#steps').innerHTML = STEPS.map(([t, s], i) => {
      const cls = placed || i < step ? 'done' : i === step ? 'on' : '';
      return (i ? `<span class="step-line ${placed || i <= step ? 'done' : ''}"></span>` : '') +
        `<button class="step ${cls}" type="button" data-step="${i}" ${cls === 'done' && !placed ? '' : 'tabindex="-1"'}${i === step && !placed ? ' aria-current="step"' : ''}><span class="n">${cls === 'done' ? icon('check') : i + 1}</span><span><b>${t}</b><small>${s}</small></span></button>`;
    }).join('');
  }

  function summaryItems(items) {
    return items.map(x => `<div class="sum-item"><span class="cart-thumb">${art(product(x.id) || x)}<i>${x.qty}</i></span><b>${esc(x.name)}</b><span class="nowrap">${money(x.price * x.qty)}</span></div>`).join('');
  }
  function renderSummary() {
    const items = placed ? placed.items : cart.items().map(x => { const p = product(x.id); return { id: p.id, name: p.name, price: p.price, qty: x.qty, art: p.art, tone: p.tone }; });
    const sub = items.reduce((s, x) => s + x.price * x.qty, 0), n = items.reduce((s, x) => s + x.qty, 0);
    $('#summary').innerHTML = `<div class="card-head"><h3>${placed ? 'Đơn vừa đặt' : 'Tóm tắt đơn hàng'}</h3><span class="badge gold" style="margin-left:auto">${n} sản phẩm</span></div>` +
      (items.length ? `<div class="sum-items">${summaryItems(items)}</div><div class="divider"></div>
        <div class="totals">
          <div class="row"><span class="muted">Tạm tính</span><span>${money(sub)}</span></div>
          <div class="row"><span class="muted">Phí giao hàng</span><span class="${ship ? '' : 'green'}">${ship ? money(ship) : 'Miễn phí'}</span></div>
          <div class="row grand"><span>Tổng thanh toán</span><b>${money(sub + ship)}</b></div>
          ${tierNote(sub)}
        </div>` : `<div class="empty" style="padding:24px 10px">${icon('cart')}Chưa có sản phẩm nào.</div>`);
  }

  // đơn hàng được cộng vào doanh số mua cộng dồn để lên đại lý (không tích điểm vào ví)
  function tierNote(sub) {
    if (!window.ADB) return '';
    const d = ADB.load(), P = ADB.plan(d), me = u && ADB.user(d, u.id);
    if (!me) return `<div class="pts-note">${icon('sparkle')}<span><a class="cyan" href="thanh-vien.html">Đăng nhập</a> để đơn hàng được cộng vào doanh số lên đại lý.</span></div>`;
    if (me.tier === 'daily') return `<div class="pts-note">${icon('award')}<span>Anh chị đang là <b>Đại lý</b>.</span></div>`;
    const spent = ADB.spent(d, me.id), after = spent + (placed ? 0 : sub), left = Math.max(0, P.agentThreshold - after);
    return `<div class="pts-note">${icon('sparkle')}<span>${placed ? 'Đơn này được cộng' : 'Đơn này cộng'} <b>${money(sub)}</b> vào doanh số mua cộng dồn khi đã thanh toán. ${left ? `Còn <b class="cyan">${money(left)}</b> nữa để lên Đại lý.` : '<b class="cyan">Đủ mốc lên Đại lý.</b>'}</span></div>`;
  }

  /* ---------- bước 1: giỏ hàng ---------- */
  function viewCart() {
    const it = cart.items();
    if (!it.length) return `<div class="card glow-gold empty reveal in">${icon('cart')}<h2 class="display" style="font-size:30px;color:var(--text)">Giỏ hàng đang trống</h2><p class="mt-1">Anh chị chọn vài món trầm hương ưng ý rồi quay lại đây để đặt hàng nhé.</p><div class="mt-3"><a class="btn btn-gold" href="san-pham.html">Xem sản phẩm ${icon('arrow')}</a></div></div>`;
    const sub = cart.total();
    return `<div class="card glow-gold">
      <div class="card-head"><div><span class="eyebrow">Bước 1</span><h2 class="display mt-1">Giỏ hàng của anh chị</h2></div><button class="link-btn" type="button" id="clearCart" style="margin-left:auto">Xóa tất cả</button></div>
      <div class="lines">${it.map(x => { const p = product(x.id); return `<div class="line">
        <a class="cart-thumb" href="san-pham-chi-tiet.html?id=${p.id}">${art(p)}</a>
        <div class="nm"><h3><a href="san-pham-chi-tiet.html?id=${p.id}">${esc(p.name)}</a></h3><div class="meta">${money(p.price)}</div></div>
        <span class="qty" aria-label="Số lượng"><button type="button" data-qty="${p.id}|-1" aria-label="Bớt">${icon('minus')}</button><span>${x.qty}</span><button type="button" data-qty="${p.id}|1" aria-label="Thêm">${icon('plus')}</button></span>
        <div class="sum"><b>${money(p.price * x.qty)}</b><button class="link-btn" type="button" data-qty="${p.id}|x">${icon('trash')}Xóa</button></div>
      </div>`; }).join('')}</div>
      <div class="totals mt-2">
        <div class="row"><span class="muted">Tạm tính (${cart.count()} sản phẩm)</span><b style="font-size:18px" class="gold">${money(sub)}</b></div>
      </div>
      <div class="nav-btns"><a class="btn btn-ghost" href="san-pham.html">${icon('back')} Tiếp tục mua sắm</a><button class="btn btn-gold" type="button" data-go="1">Tiếp tục ${icon('arrow')}</button></div>
    </div>`;
  }

  /* ---------- bước 2: thông tin ---------- */
  const field = (k, label, html, full, req) => `<div class="field${full ? ' full' : ''}" data-f="${k}"><label for="f-${k}">${label}${req ? ' <span class="req">*</span>' : ''}</label>${html}<span class="err" hidden></span></div>`;
  function viewInfo() {
    return `<form class="card glow-gold" id="infoForm" novalidate>
      <div class="card-head"><div><span class="eyebrow">Bước 2</span><h2 class="display mt-1">Thông tin giao hàng</h2></div></div>
      ${u ? `<p class="pts-note" style="margin-bottom:16px">${icon('user')}<span>Đã điền sẵn theo tài khoản <b>${esc(u.name)}</b>. Anh chị có thể sửa lại nếu giao cho người khác.</span></p>` : `<p class="muted" style="font-size:13px;margin-bottom:16px">Đã có tài khoản? <a class="cyan" href="thanh-vien.html">Đăng nhập</a> để điền nhanh và tích điểm PS.</p>`}
      <div class="form-grid">
        ${field('name', 'Họ và tên', `<input class="input" id="f-name" name="name" autocomplete="name" value="${esc(form.name)}" placeholder="Nguyễn Văn A">`, 0, 1)}
        ${field('phone', 'Số điện thoại', `<input class="input" id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" value="${esc(form.phone)}" placeholder="0912 345 678">`, 0, 1)}
        ${field('email', 'Email', `<input class="input" id="f-email" name="email" type="email" autocomplete="email" value="${esc(form.email)}" placeholder="Để nhận xác nhận đơn (không bắt buộc)">`)}
        ${field('province', 'Tỉnh / thành phố', `<select class="input" id="f-province" name="province"><option value="">Chọn tỉnh, thành phố</option>${PROVINCES.map(p => `<option${p === form.province ? ' selected' : ''}>${p}</option>`).join('')}</select>`, 0, 1)}
        ${field('address', 'Địa chỉ nhận hàng', `<input class="input" id="f-address" name="address" autocomplete="street-address" value="${esc(form.address)}" placeholder="Số nhà, đường, phường hoặc xã">`, 1, 1)}
        ${field('note', 'Ghi chú', `<textarea class="input" id="f-note" name="note" rows="3" style="min-height:90px" placeholder="Thời gian nhận hàng, size cổ tay, lời nhắn in thiệp quà tặng...">${esc(form.note)}</textarea>`, 1)}
      </div>
      <h3 class="mt-3" style="font-size:16px;margin-bottom:12px">Phương thức thanh toán</h3>
      <div class="choice">
        <label class="${u ? '' : 'off'}"><input type="radio" name="pay" value="wallet"${form.pay === 'wallet' ? ' checked' : ''}${u ? '' : ' disabled'}><span class="c-ico">${icon('wallet')}</span><span><b>Thanh toán bằng ví điểm</b><small>${u ? `Trừ ví điểm mua hàng (${PS(shopBal())}) trước, còn lại trừ ví tiền mặt (${money(cashBal())}).` : '<a class="gold" href="thanh-vien.html">Đăng nhập</a> để thanh toán bằng ví.'}</small></span></label>
        <label><input type="radio" name="pay" value="bank"${form.pay === 'bank' ? ' checked' : ''}><span class="c-ico">${icon('card')}</span><span><b>Chuyển khoản ngân hàng</b><small>Đơn được xử lý ngay khi nhận được chuyển khoản.</small></span></label>
      </div>
      <div id="walletBox">${walletNote()}</div>
      <div class="bank" id="bankBox"${form.pay === 'bank' ? '' : ' hidden'}>
        <dl class="kv"><dt>Ngân hàng</dt><dd>${esc(S.bank.name)}</dd><dt>Số tài khoản</dt><dd><b class="gold">${esc(S.bank.account)}</b></dd><dt>Chủ tài khoản</dt><dd>${esc(S.bank.owner)}</dd><dt>Nội dung</dt><dd>Mã đơn hàng (hiện sau khi đặt)</dd></dl>
      </div>
      <div class="nav-btns"><button class="btn btn-ghost" type="button" data-go="0">${icon('back')} Quay lại giỏ hàng</button><button class="btn btn-gold" type="submit">Xem lại đơn ${icon('arrow')}</button></div>
    </form>`;
  }
  function readForm() {
    const f = $('#infoForm'); if (!f) return;
    ['name', 'phone', 'email', 'province', 'address', 'note'].forEach(k => form[k] = f.elements[k].value.trim());
    form.pay = f.elements.pay.value || '';
  }
  function validate() {
    const e = {};
    if (form.name.length < 2) e.name = 'Anh chị vui lòng nhập họ tên người nhận.';
    if (!form.phone) e.phone = 'Anh chị vui lòng nhập số điện thoại.';
    else if (!/^0\d{9}$/.test(normPhone(form.phone))) e.phone = 'Số điện thoại gồm 10 chữ số và bắt đầu bằng số 0.';
    if (form.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) e.email = 'Email chưa đúng định dạng.';
    if (!form.province) e.province = 'Anh chị vui lòng chọn tỉnh, thành phố.';
    if (form.address.length < 5) e.address = 'Anh chị vui lòng nhập địa chỉ nhận hàng cụ thể.';
    $$('#infoForm .field').forEach(n => { const m = e[n.dataset.f]; n.classList.toggle('bad', !!m); const s = n.querySelector('.err'); s.hidden = !m; s.textContent = m || ''; });
    const first = Object.keys(e)[0]; if (first) $('#f-' + first).focus();
    if (!first && !form.pay) { toast('Anh chị chọn phương thức thanh toán.'); return false; }
    if (!first && form.pay === 'wallet' && !walletOk()) { toast('Số dư ví chưa đủ. Anh chị nạp thêm tiền hoặc chọn chuyển khoản.'); return false; }
    return !first;
  }

  /* ---------- bước 3: xác nhận ---------- */
  function viewReview() {
    const it = cart.items(), sub = cart.total();
    return `<div class="card glow-gold">
      <div class="card-head"><div><span class="eyebrow">Bước 3</span><h2 class="display mt-1">Xác nhận đơn hàng</h2></div></div>
      <div class="review">
        <div class="box"><h4>${icon('pin')} Giao đến <button class="link-btn" type="button" data-go="1">Sửa</button></h4>
          <dl class="kv"><dt>Người nhận</dt><dd>${esc(form.name)}</dd><dt>Điện thoại</dt><dd>${esc(form.phone)}</dd>${form.email ? `<dt>Email</dt><dd style="word-break:break-all">${esc(form.email)}</dd>` : ''}<dt>Địa chỉ</dt><dd>${esc(form.address)}, ${esc(form.province)}</dd>${form.note ? `<dt>Ghi chú</dt><dd>${esc(form.note)}</dd>` : ''}</dl></div>
        <div class="box"><h4>${icon('wallet')} Thanh toán <button class="link-btn" type="button" data-go="1">Sửa</button></h4>
          <p style="font-size:14px"><b>${form.pay === 'bank' ? 'Chuyển khoản ngân hàng' : 'Thanh toán bằng ví điểm'}</b></p>
          <p class="muted mt-1" style="font-size:13px">${form.pay === 'bank' ? `Chuyển khoản tới ${esc(S.bank.name)}, số tài khoản ${esc(S.bank.account)}, nội dung ghi mã đơn hàng.` : `${payUsed() ? `Ví điểm mua hàng trừ ${PS(payUsed())}. ` : ''}${cashUsed() ? `Ví tiền mặt trừ ${money(cashUsed())}. ` : ''}Đơn được ghi nhận đã thanh toán ngay.`}</p></div>
      </div>
      <div class="box mt-2" style="padding:0">
        <div class="lines">${it.map(x => { const p = product(x.id); return `<div class="sum-item" style="padding:10px 0;border-bottom:1px solid var(--line)"><span class="cart-thumb">${art(p)}<i>${x.qty}</i></span><b>${esc(p.name)} <span class="dim">x ${x.qty}</span></b><span class="nowrap gold">${money(p.price * x.qty)}</span></div>`; }).join('')}</div>
      </div>
      <div class="totals mt-2">
        <div class="row"><span class="muted">Tạm tính</span><span>${money(sub)}</span></div>
        <div class="row"><span class="muted">Phí giao hàng</span><span class="${ship ? '' : 'green'}">${ship ? money(ship) : 'Miễn phí'}</span></div>
        <div class="row grand"><span>Tổng thanh toán</span><b>${money(sub + ship)}</b></div>
        ${payUsed() ? `<div class="row" data-pt-line><span class="muted">Trừ ví điểm mua hàng</span><span class="green">-${PS(payUsed())}</span></div>` : ''}${cashUsed() ? `<div class="row"><span class="muted">Trừ ví tiền mặt</span><span class="cyan">-${money(cashUsed())}</span></div>` : ''}${payUsed() || cashUsed() ? `<div class="row"><span class="muted">Còn phải thanh toán</span><b class="gold">${money(sub + ship - payUsed() - cashUsed())}</b></div>` : ''}
      </div>
      <p class="dim mt-2" style="font-size:12px">Bấm xác nhận nghĩa là anh chị đồng ý với chính sách đổi trả và bảo hành của Phúc Sinh QuanTum. Nhân viên sẽ gọi xác nhận trước khi giao.</p>
      <div class="nav-btns"><button class="btn btn-ghost" type="button" data-go="1">${icon('back')} Quay lại</button><button class="btn btn-gold btn-lg" type="button" id="placeBtn">${icon('check')} Xác nhận đặt hàng</button></div>
    </div>`;
  }

  // số dư ví và phần còn thiếu khi chọn thanh toán bằng ví
  function walletNote() {
    if (form.pay !== 'wallet' || !u) return '';
    const lack = due() - walletBal();
    return lack > 0 ? `<p class="pts-note mt-2">${icon('info')}<span>Ví còn thiếu <b class="gold">${money(lack)}</b> cho đơn này. <a class="gold" href="thanh-vien.html#nap-diem">Nạp tiền vào ví tiền mặt</a> rồi quay lại, hoặc chọn chuyển khoản.</span></p>`
      : `<p class="pts-note mt-2">${icon('check')}<span>Ví đủ thanh toán ${money(due())}.${payUsed() ? ` Trừ ${PS(payUsed())} ví mua hàng` : ''}${cashUsed() ? `${payUsed() ? ',' : ' Trừ'} ${money(cashUsed())} ví tiền mặt` : ''}.</span></p>`;
  }
  function viewSuccess(o) {
    const sp = o.shopPaid || 0, cp = o.cashPaid || 0, due = Math.max(0, o.total - sp - cp), bank = o.pay === 'bank' && due > 0;
    return `<div class="card glow-mix success">
      <div class="ok-ico">${icon('check')}</div>
      <span class="eyebrow">Đặt hàng thành công</span>
      <h2 class="display mt-1" style="font-size:clamp(28px,3vw,38px)">Cảm ơn ${esc(o.name)}!</h2>
      <p class="muted mt-1">Mã đơn hàng của anh chị</p>
      <div class="oid mt-1">${esc(o.id)}</div>
      <div class="mt-2">${statusBadge(o.status)}</div>
      <div class="info">
        <div class="box" style="padding:16px;border-radius:14px;background:rgba(0,0,0,.22);border:1px solid var(--line)">
          <dl class="kv"><dt>Tổng đơn hàng</dt><dd><b class="${sp || cp ? '' : 'gold'}" style="font-size:${sp || cp ? 15 : 18}px">${money(o.total)}</b></dd>${sp ? `<dt>Đã dùng điểm</dt><dd class="green">${PS(sp)}</dd>` : ''}${cp ? `<dt>Ví tiền mặt</dt><dd class="cyan">${money(cp)}</dd>` : ''}${sp || cp ? `<dt>Còn phải trả</dt><dd><b class="gold" style="font-size:18px">${money(due)}</b></dd>` : ''}<dt>Giao đến</dt><dd>${esc(o.address)}</dd><dt>Thanh toán</dt><dd>${due === 0 ? (sp && cp ? 'Ví điểm mua hàng và ví tiền mặt' : cp ? 'Ví tiền mặt' : 'Ví điểm mua hàng') : bank ? 'Chuyển khoản ngân hàng' : 'Khi nhận hàng (COD)'}</dd></dl>
        </div>
        ${bank ? `<div class="bank mt-2"><p style="font-size:14px;margin-bottom:10px"><b>Thông tin chuyển khoản</b></p><dl class="kv"><dt>Ngân hàng</dt><dd>${esc(S.bank.name)}</dd><dt>Số tài khoản</dt><dd><b class="gold">${esc(S.bank.account)}</b></dd><dt>Chủ tài khoản</dt><dd>${esc(S.bank.owner)}</dd><dt>Số tiền</dt><dd>${money(due)}</dd><dt>Nội dung</dt><dd><b class="cyan">${esc(o.id)}</b></dd></dl></div>`
          : due === 0 ? `<p class="pts-note mt-2">${icon('check')}<span>Đơn đã thanh toán đủ bằng ví. ${sp ? `Ví mua hàng còn <b>${PS(shopBal())}</b>. ` : ''}${cp ? `Ví tiền mặt còn <b>${money(cashBal())}</b>. ` : ''} Nhân viên sẽ gọi số <b>${esc(o.phone)}</b> để xác nhận giao hàng.</span></p>`
          : `<p class="pts-note mt-2">${icon('truck')}<span>Nhân viên sẽ gọi số <b>${esc(o.phone)}</b> để xác nhận. Anh chị kiểm tra hàng rồi thanh toán ${money(due)} khi nhận.</span></p>`}
      </div>
      <div class="actions"><a class="btn btn-gold" href="thanh-vien.html">${icon('user')} Xem đơn hàng</a><a class="btn btn-outline-gold" href="san-pham.html">Tiếp tục mua sắm</a></div>
    </div>`;
  }

  function render(scroll) {
    if (!placed && step > 0 && !cart.count()) step = 0;
    renderSteps(); renderSummary();
    $('#main').innerHTML = placed ? viewSuccess(placed) : [viewCart, viewInfo, viewReview][step]();
    if (scroll) scrollTo({ top: 0, behavior: 'smooth' });
  }
  function go(n) {
    if (n === step || placed) return;
    if (step === 1) { readForm(); if (n > 1 && !validate()) return; }
    if (n >= 1 && !cart.count()) return;
    if (n === 2 && !validateSilent()) { step = 1; render(true); validate(); return; }
    step = n; render(true);
  }
  function validateSilent() { return form.name.length >= 2 && /^0\d{9}$/.test(normPhone(form.phone)) && form.province && form.address.length >= 5 && (!form.email || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)); }

  // sự kiện
  $('#page').addEventListener('click', e => {
    const g = e.target.closest('[data-go]'); if (g && !g.hasAttribute('data-add')) { e.preventDefault(); go(+g.dataset.go); return; }
    const s = e.target.closest('.step.done'); if (s && !placed) { go(+s.dataset.step); return; }
    if (e.target.closest('#clearCart')) { cart.clear(); toast('Đã xóa giỏ hàng'); return; }
    if (e.target.closest('#placeBtn')) {
      const b = $('#placeBtn'); b.disabled = true;
      const want = payUsed(), wantCash = cashUsed(); // tính trước khi giỏ hàng được xóa
      const res = PSQ.placeOrder({ name: form.name, phone: normPhone(form.phone), email: form.email, address: `${form.address}, ${form.province}`, note: form.note, pay: form.pay });
      if (res.error) { b.disabled = false; toast(res.error); return; }
      placed = res.order;
      if ((want || wantCash) && u && window.ADB) {
        const d = ADB.load(), o = d.orders.find(x => x.id === placed.id), me = ADB.user(d, u.id);
        const used = o && me && want ? ADB.spendShop(d, me, o, want) : 0, usedC = o && me && wantCash ? ADB.spendCash(d, me, o, wantCash) : 0;
        if (used || usedC) {
          const full = used + usedC >= o.total;
          if (full) { o.status = 'paid'; ADB.settleOrder(d, o); }
          ADB.log(d, 'Thanh toán bằng ví', `${o.id}: ${me.name}${used ? ` dùng ${PS(used)} ví mua hàng` : ''}${usedC ? ` trả ${money(usedC)} ví tiền mặt` : ''}${full ? ', đã thanh toán đủ' : ''}`);
          ADB.save(d); placed = o;
        }
      }
      render(true); toast('Đặt hàng thành công: ' + placed.id);
    }
  });
  $('#main').addEventListener('submit', e => { if (e.target.id === 'infoForm') { e.preventDefault(); readForm(); if (validate()) { step = 2; render(true); } } });
  $('#main').addEventListener('change', e => {
    if (e.target.name === 'pay') { $('#bankBox').hidden = e.target.value !== 'bank'; form.pay = e.target.value; $('#walletBox').innerHTML = walletNote(); }
  });
  $('#main').addEventListener('input', e => { const f = e.target.closest('.field.bad'); if (f) { f.classList.remove('bad'); f.querySelector('.err').hidden = true; } });
  document.addEventListener('cart:change', () => {
    if (placed) return;
    if (step === 1) readForm();
    if (step === 1 && cart.count()) { renderSummary(); return; } // giữ nguyên ô nhập đang gõ
    render();
  });

  // tra cứu đơn
  $('#lookup').addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target, id = f.oid.value.trim().toUpperCase().replace(/\s/g, ''), ph = normPhone(f.phone.value), out = $('#lookupRes');
    if (!id || !ph) { out.innerHTML = `<p class="red" style="font-size:13px">Anh chị nhập đủ mã đơn và số điện thoại.</p>`; return; }
    const o = PSQ.db.load().orders.find(x => x.id.toUpperCase() === id && normPhone(x.phone) === ph);
    out.innerHTML = o ? `<div class="box"><div class="row"><b class="gold">${esc(o.id)}</b>${statusBadge(o.status)}</div>
        <div class="row"><span class="dim">Ngày đặt</span><span>${fdate(o.date)}</span></div>
        <div class="row"><span class="dim">Sản phẩm</span><span>${o.items.reduce((s, x) => s + x.qty, 0)} món</span></div>
        <div class="row"><span class="dim">Tổng tiền</span><b>${money(o.total)}</b></div></div>`
      : `<div class="box"><span class="muted">Không tìm thấy đơn hàng khớp với mã và số điện thoại này. Anh chị kiểm tra lại hoặc gọi <a class="gold" href="tel:${esc(S.phone.replace(/\s/g, ''))}">${esc(S.phone)}</a>.</span></div>`;
  });

  render();
  PSQ.reveal();
})();
</script>
</body>
</html>
