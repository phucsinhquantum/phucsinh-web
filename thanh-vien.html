  .ww-win h3 { margin: 4px 0; font-size: 22px; } .ww-code { display: inline-block; margin: 6px 0; padding: 8px 18px; border-radius: 10px; border: 2px dashed #f3c76b; font-size: 22px; font-weight: 800; letter-spacing: 2px; color: #f3c76b; }

  #fr::placeholder { text-transform: none; font-size: 13px; letter-spacing: 0; }
  .dl-glow { position: relative; display: inline-flex; align-items: center; gap: 5px; padding: 4px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 700; color: #1d1507; white-space: nowrap; text-decoration: none; overflow: hidden;
    background: linear-gradient(135deg, #ffe09a, #f3c76b 45%, #e0a94a); box-shadow: 0 0 0 1px rgba(255, 224, 154, .6), 0 0 14px -2px rgba(243, 199, 107, .8); animation: dlPulse 2s ease-in-out infinite; }
  .dl-glow svg { width: 14px; height: 14px; }
  .dl-glow::after { content: ''; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .75), transparent); transform: skewX(-20deg); animation: dlShine 2.6s ease-in-out infinite; }
  .dl-glow:hover { filter: brightness(1.08); }
  @keyframes dlPulse { 0%, 100% { box-shadow: 0 0 0 1px rgba(255, 224, 154, .6), 0 0 10px -2px rgba(243, 199, 107, .6); } 50% { box-shadow: 0 0 0 1px rgba(255, 224, 154, .9), 0 0 22px 2px rgba(243, 199, 107, .95); } }
  @media (max-width: 560px) { #fr::placeholder { font-size: 11.5px; } }
  @media (prefers-reduced-motion: reduce) { .dl-glow, .dl-glow::after { animation: none; } }
  @keyframes dlShine { 0%, 55% { left: -60%; } 100% { left: 130%; } }
  .w-info { display: block; margin-top: 3px; font-size: 12px; line-height: 1.45; color: var(--text-2); } .w-info b { color: var(--text); font-weight: 600; }
  .ref-lbl { display: inline-flex; align-items: center; gap: 5px; flex: none; font-size: 12.5px; color: var(--gold); font-weight: 600; } .ref-lbl svg { width: 15px; height: 15px; }
  @media (max-width: 560px) { .ref-mini { flex-wrap: wrap; } .ref-lbl { flex-basis: 100%; } }

<body data-page="member">
<div id="page" data-title="Thành viên" data-crumb="Thành viên">
  <div id="view"></div>
</div>

<script src="js/patch.js?v=20261031a"></script>
<script src="js/api.js?v=20261031a"></script>
<script src="js/data.js?v=20261031a"></script>
<script src="js/app.js?v=20261031a"></script>
<script src="js/psq-data.js?v=20261031a"></script>
<script>
(function () {
  const { $, esc, money, icon, auth, statusBadge, toast, initials, fdate, modal, short, today } = PSQ;
  const view = $('#view');
  const refCode = ((PSQ.qs('ref') || '').trim() || PSQ.refCode()).toUpperCase().slice(0, 30);   // mã ở link lúc đăng ký, không có thì mã link đầu tiên đã nhớ
  const W = ADB.WALLETS, WK = ['cash', 'avail', 'sales', 'bonus', 'shop'].filter(k => W[k]).concat(Object.keys(W).filter(k => !['cash', 'avail', 'sales', 'bonus', 'shop'].includes(k)));
  const ps = n => (Math.round(n) || 0).toLocaleString('vi-VN') + ' PS';
  const WST = { done: ['Hoàn tất', 'ok'], pending: ['Chờ duyệt', 'pending'], rejected: ['Từ chối', 'failed'] };
  const wB = s => `<span class="badge ${(WST[s] || [])[1] || ''}">${(WST[s] || [s])[0]}</span>`;
  const tierB = u => { const t = ADB.tierOf(u); return `<span class="badge tier-b" style="--c:${t.color}">${icon((u.tier || 'khach') === 'daily' ? 'award' : (u.tier || 'khach') === 'ctv' ? 'star' : 'user')} ${esc(t.name)}</span>`; };
  const wdot = k => `<span class="wdot" style="--c:${W[k].color}">${esc(W[k].short)}</span>`;
  // ảnh đại diện (nếu có) hoặc chữ viết tắt
  const av = (u, cls = '') => `<span class="avatar ${cls}">${u && u.avatar ? `<img src="${esc(u.avatar)}" alt="">` : esc(initials((u && u.name) || ''))}</span>`;
  const wamt = (k, n) => (W[k] && W[k].unit === 'vnd') ? money(n) : ps(n);
  // chi tiết khoản nhận từ đơn hàng: ai mua, qua ai, đơn bao nhiêu
  const winfo = w => { const i = w.info; if (!i) return ''; const sell = w.type === 'referral' ? 'Người kích hoạt' : 'Người mua';
    return `<small class="w-info">${sell}: <b>${esc(i.buyer)}</b>${i.via ? ` · qua <b>${esc(i.via)}</b>` : ''}<br>Đơn ${esc(i.order)}: ${money(i.total)}${i.items ? ` (${esc(i.items)})` : ''}</small>`; };
  const wnote = k => { const t = (ADB.load().settings.plan || {}).taxRate ?? 10; return k === 'sales' ? 'Hoa hồng bằng tiền, rút sang ví tiền mặt trừ thuế thu nhập ' + t + '%' : k === 'bonus' ? 'Thu nhập từ đại lý tuyến dưới, chuyển sang ví khả dụng trừ thuế ' + t + '%' : W[k].note; };
  const lower1 = s => s.charAt(0).toLowerCase() + s.slice(1);
  const histBtn = k => `<button class="icon-btn whist" type="button" data-wh="${k}" aria-label="Lịch sử ${esc(lower1(W[k].name))}" title="Lịch sử giao dịch">${icon('clock')}</button>`;
  // giao dịch gần đây: chỉ hoa hồng bán hàng, thưởng giới thiệu CTV, lệnh nạp và rút tiền
  const RECENT = ['commission', 'referral', 'topup', 'withdraw', 'tocash'];
  const recentOf = rows => rows.filter(w => RECENT.includes(w.type) && !(w.type === 'tocash' && ADB.walletOf(w) === 'cash'));
  const isKhach = u => (u.tier || 'khach') === 'khach' && u.role !== 'admin';
  const refLinkOf = u => location.origin + location.pathname + '?ref=' + encodeURIComponent(u.code || '');
  const khachNote = (act = true) => `<p class="khach-note">${icon('info')}<span>Tài khoản khách hàng vẫn giới thiệu được người khác nhưng chưa nhận hoa hồng. Kích hoạt CTV để bắt đầu nhận hoa hồng.${act ? ' <a class="gold" href="#kich-hoat">Kích hoạt CTV</a>' : ''}</span></p>`;
  async function copyFrom(inp) {
    if (!inp) return;
    try { await navigator.clipboard.writeText(inp.value); } catch (e) { inp.select(); try { document.execCommand('copy'); } catch (er) {} }
    toast('Đã sao chép đường dẫn giới thiệu');
  }
  // gửi thao tác lên máy chủ: lỗi thì hiện ở el (hoặc thông báo đỏ), xong thì hiện msg
  // khung chờ thanh toán + gửi bill cho đơn gói (CTV, đại lý) và yêu cầu nạp tiền; duyệt xong vẽ lại trang
  let openBill = false;
  const billWait = (kind, x, redo, paidTitle, paidSub) => {
    const open = openBill; openBill = false;
    PSQ.payWait.start({ open, paidTitle, paidSub, onPaid: () => setTimeout(redo, 2500),
      send: bill => kind === 'topup' ? API.act('topupClaim', { id: x.id, bill }) : API.act('paidClaim', { id: x.id, bill }),
      check: () => API.act('payStatus', { kind, id: x.id }).status });
  };
  // trả gói bằng ví điểm khả dụng (1 PS = 1đ): đủ điểm thì hệ thống tự kích hoạt, không cần công ty duyệt
  const ptsBox = (d, me, price, o) => {
    if (o && o.status !== 'pending') return '';
    const b = ADB.balances(d, me.id).avail, ok = b >= price;
    return `<div class="pts-pay mt-2"><div><b>Trả bằng điểm khả dụng</b><small>Ví điểm khả dụng: <b class="${ok ? 'green' : 'gold'}">${ps(b)}</b>${ok ? ', đủ để thanh toán. Kích hoạt ngay, không cần chờ duyệt.' : `, cần ${ps(price)}. Anh chị nhận thêm điểm từ thành viên khác hoặc chuyển khoản.`}</small></div><button class="btn btn-sm ${ok ? 'btn-gold' : ''}" type="button" id="ptBuy"${ok ? '' : ' disabled'}>${icon('gem')} Trả ${ps(price)}</button></div>`;
  };
  const bindPts = (box, name, price, done, redo) => { const b = $('#ptBuy', box); if (b) b.addEventListener('click', () => {
    if (!confirm(`Trừ ${ps(price)} từ ví điểm khả dụng để ${done.toLowerCase()}?`)) return;
    b.disabled = true; PSQ.payWait.stop();
    if (act(name, { pay: 'points' }, done + ' thành công')) redo(); else b.disabled = false;
  }); };
  const waitBox = x => x.status === 'pending' ? PSQ.payWait.html({ sent: !!(x.bills || []).length }) : '';
  const act = (name, args, msg, el) => { const r = API.act(name, args); if (r.error) { if (el) el.textContent = r.error; else toast(r.error, 'err'); return null; } if (msg) toast(typeof msg === 'function' ? msg(r) : msg); return r; };
  const head = (t, sub, right = '') => `<div class="card-head" style="flex-wrap:wrap"><div><h3>${t}</h3>${sub ? `<div class="sub">${sub}</div>` : ''}</div>${right ? `<div style="margin-left:auto">${right}</div>` : ''}</div>`;
  const ph = (t, sub) => `<div class="tv-ph"><h2>${t}</h2>${sub ? `<p class="dim">${sub}</p>` : ''}</div>`;
  const note = `<p class="biz-note">${icon('info')}Nạp tiền vào ví khi công ty xác nhận đã nhận tiền. Rút tiền về ngân hàng do công ty duyệt và chuyển khoản.</p>`;
  const pctOf = (v, t) => t > 0 ? Math.round(v / t * 100) : 0;
  const isPkg = o => (o.items || []).some(x => x.id === ADB.PKG_ID);
  const anyPkg = o => ADB.isPkgOrder(o);
  const pkgOrder = (d, id) => d.orders.find(o => o.userId === id && o.status !== 'failed' && isPkg(o));
  const agentOrder = (d, id) => d.orders.find(o => o.userId === id && o.status !== 'failed' && ADB.isAgentPkgOrder(o));
  // quyền lợi từng cấp (Quản trị > Trang web > Quyền lợi CTV, đại lý)
  const perks = (d, k) => { const V = ADB.planVars(d); return (window.PERKS[k] || []).map(x => ADB.fill(x, V)); };
  const perkLi = (d, k) => perks(d, k).map(x => `<li>${x}</li>`).join('');
  const PAYN = { bank: 'Chuyển khoản', cod: 'Thanh toán khi nhận hàng', shop: 'Ví điểm mua hàng', wallet: 'Thanh toán bằng ví' };

  /* ---------- tên truy cập ---------- */
  const UNAME = /^[a-z0-9._]{3,30}$/;
  /* ---------- menu ---------- */
  let ME = null;
  const MENU = (d, me) => [
    ['', [['tong-quan', 'Tổng quan', 'grid'], (me.tier || 'khach') === 'khach' && ['kich-hoat', 'Kích hoạt CTV', 'sparkle'], me.tier !== 'daily' && ADB.plan(d).agentPkgOn && ['len-dai-ly', 'Đăng ký đại lý', 'award'], ['dai-ly', 'Danh sách đại lý', 'users'], ['khach-hang', 'Khách hàng', 'user'], ['lanh-dao', 'Cấp bậc lãnh đạo', 'star']].filter(Boolean)],
    ['Mua hàng', [['san-pham', 'Sản phẩm', 'bag'], ['gio-hang', 'Giỏ hàng', 'cart'], ['don-hang', 'Đơn hàng của tôi', 'truck']]],
    ['Tài chính', [['vi', 'Ví của tôi', 'wallet'], ['giao-dich', 'Giao dịch của tôi', 'activity'], ['hoa-hong', 'Hoa hồng', 'award'], ['nap-diem', 'Nạp tiền', 'plus']]],
    ['Tài khoản', [['ho-so', 'Hồ sơ của tôi', 'user'], ['dia-chi', 'Sổ địa chỉ', 'pin']]]
  ];
  const ACTIONS = { 'san-pham': () => { location.href = 'san-pham.html'; }, 'gio-hang': () => PSQ.openCart(true) };

  function member() {
    view.innerHTML = `<div class="tv-layout">
      <aside class="tv-side card" aria-label="Danh mục tài khoản">
        <div class="tv-me" id="tvMe"></div>
        <label class="tv-pick"><span class="sr-only">Chọn mục</span><select class="input" id="tvPick"></select></label>
        <nav id="tvNav"></nav>
        <button class="tv-out" id="tvOut" type="button">${icon('logout')} Đăng xuất</button>
      </aside>
      <div class="tv-main" id="tvPane"></div></div>`;
    $('#tvOut').addEventListener('click', () => { const x = auth.logout(); location.href = (x && x.back) || 'thanh-vien.html'; });
    $('#tvNav').addEventListener('click', e => { const b = e.target.closest('button[data-act]'); if (b) ACTIONS[b.dataset.act](); });
    $('#tvPick').addEventListener('change', e => { const v = e.target.value; if (ACTIONS[v]) { ACTIONS[v](); e.target.value = route(); } else location.hash = v; });
    // nút thao tác ví dùng chung trong mọi màn hình
    $('#tvPane').addEventListener('click', e => {
      const a = e.target.closest('[data-wa]'); if (a) return walletAct(a.dataset.wa);
      const h = e.target.closest('[data-wh]'); if (h) { e.preventDefault(); return walletHist(h.dataset.wh); }
      const cp = e.target.closest('[data-copy]'); if (cp) return copyFrom(document.getElementById(cp.dataset.copy));
      const c = e.target.closest('[data-cart]'); if (c) return PSQ.openCart(true);
      if (e.target.closest('[data-welcome]')) return welcomeWheel();
      if (e.target.closest('[data-share-ref]')) { const u = $('#ovRef').value; navigator.share({ title: 'Phúc Sinh QuanTum', text: 'Mời anh chị đăng ký thành viên Phúc Sinh QuanTum qua link giới thiệu của em:', url: u }).catch(() => {}); return; }
      const cc = e.target.closest('[data-cpcopy]'); if (cc) { navigator.clipboard && navigator.clipboard.writeText(cc.dataset.cpcopy).catch(() => {}); return toast('Đã sao chép mã ' + cc.dataset.cpcopy); }
    });
    addEventListener('hashchange', () => { render(); const top = $('#tvPane').getBoundingClientRect().top; if (top < 0) scrollTo({ top: scrollY + top - 90 }); });
    render();
    { const d = ADB.load(), me = ADB.user(d, ME); if (!API.imp && ADB.welcomeCan(d, me)) setTimeout(welcomeWheel, 600); }
  }
  const route = () => location.hash.slice(1) || 'tong-quan';

  function render() {
    const d = ADB.load(), me = ADB.user(d, ME); if (!me) { auth.logout(); return location.reload(); }
    let r = route();
    if (r === 'cho-len-cay') { history.replaceState(null, '', '#khach-hang'); r = 'khach-hang'; } // đường dẫn cũ
    if (!PANES[r]) r = 'tong-quan';
    const menu = MENU(d, me), wait = d.users.filter(x => x.sponsor === me.id && isKhach(x)).length + (d.guests || []).length;
    $('#tvMe').innerHTML = `${av(me, 'g')}<div><b>${esc(me.name)}</b>@${esc(me.username || '')} · <span style="color:${ADB.tierOf(me).color}">${esc(ADB.tierOf(me).name)}</span></div>`;
    $('#tvNav').innerHTML = (me.role === 'admin' ? `<a href="quan-tri.html">${icon('shield')}<span>Trang quản trị</span></a>` : '') + menu.map(([g, list]) => (g ? `<h4>${esc(g)}</h4>` : '') + list.map(([id, l, ic]) => ACTIONS[id]
      ? `<button type="button" data-act="${id}">${icon(ic)}<span>${esc(l)}</span></button>`
      : `<a href="#${id}" class="${id === r ? 'on' : ''}${id === 'kich-hoat' && id !== r ? ' hot' : ''}"${id === r ? ' aria-current="page"' : ''}>${icon(ic)}<span>${esc(l)}</span>${id === 'khach-hang' && wait ? `<span class="badge">${wait}</span>` : ''}</a>`).join('')).join('');
    $('#tvPick').innerHTML = menu.map(([g, list]) => `<optgroup label="${esc(g || 'Tài khoản kinh doanh')}">${list.map(([id, l]) => `<option value="${id}"${id === r ? ' selected' : ''}>${esc(l)}</option>`).join('')}</optgroup>`).join('');
    if (!list(menu).includes(r)) { const o = document.createElement('option'); o.value = r; o.textContent = 'Kích hoạt CTV'; o.selected = true; $('#tvPick').prepend(o); }
    const box = $('#tvPane'); box.innerHTML = '';
    PANES[r](box, d, me, render);
    const al = actAlert(d, me); if (al) box.insertAdjacentHTML('afterbegin', al);
  }
  const list = menu => menu.flatMap(g => g[1].map(x => x[0]));

  /* ---------- điều kiện nhận thu nhập từ đại lý tuyến dưới ---------- */
  const MODE_NOTE = { hold: n => `Chưa đủ điều kiện thì khoản 40% được giữ lại tối đa ${n} ngày, đủ điều kiện trong thời gian này sẽ tự vào ví.`, lose: () => 'Chưa đủ điều kiện thì khoản 40% phát sinh trong thời gian đó không được nhận.', up: () => 'Chưa đủ điều kiện thì khoản 40% chuyển cho đại lý đủ điều kiện ở tuyến trên.' };
  const actItem = (x, P, a) => { const na = !x.ok && a && a.ok && !a.all; return `<li class="${x.ok ? 'ok' : na ? 'na' : 'no'}"><i>${x.ok ? '✓' : na ? '–' : '!'}</i><div><b>${esc(x.label)}${x === 'buy' ? '' : ''}</b><small>${x.ok ? `Gần nhất ${fdate(x.last)} · ${x.count} đơn trong ${P.activeDays} ngày` : `Chưa có trong ${P.activeDays} ngày gần nhất`}</small></div>${x.ok ? `<span class="badge ${x.left <= 7 ? 'pending' : 'paid'}">Còn ${x.left} ngày</span>` : a && a.ok && !a.all ? '<span class="badge">Không bắt buộc</span>' : '<span class="badge failed">Thiếu</span>'}</li>`; };
  function actCard(d, me) {
    const a = ADB.activity(d, me.id), P = ADB.plan(d), e = ADB.earnings(d, me.id);
    const min = [P.activeMinBuy ? `đơn tự mua từ ${money(P.activeMinBuy)}` : '', P.activeMinSell ? `đơn bán từ ${money(P.activeMinSell)}` : ''].filter(Boolean).join(', ');
    return `<div class="card ${a.ok ? 'glow-cyan' : 'glow-gold'} mt-2" id="dieu-kien">${head('Điều kiện nhận thu nhập từ đại lý tuyến dưới', a.ok ? `Đang đủ điều kiện · còn ${a.left} ngày` : a.all ? `Còn thiếu ${a.missing.length} điều kiện` : 'Chưa đủ điều kiện, cần 1 trong 2 việc bên dưới')}
      <ul class="act-list">${actItem(a.buy, P, a)}${actItem(a.sell, P, a)}</ul>
      ${e.held ? `<p class="mt-2" style="font-size:13.5px">Đang giữ chờ <b class="gold">${ps(e.held)}</b>. <a class="cyan" href="#hoa-hong">Xem chi tiết</a></p>` : ''}
      <p class="dim mt-2" style="font-size:12.5px">Trong ${P.activeDays} ngày gần nhất, đại lý cần có ${a.all ? 'cả đơn tự mua và đơn bán' : 'đơn tự mua hoặc đơn bán (chỉ cần 1 trong 2)'} (đơn bán là người mình giới thiệu trực tiếp mua), đã thanh toán${min ? ` (${min})` : ''}. ${MODE_NOTE[P.overrideMode] ? MODE_NOTE[P.overrideMode](P.holdDays) : ''} Hoa hồng bán hàng ${P.agentRate}% không bị ảnh hưởng.</p></div>`;
  }
  // cảnh báo đầu trang khi thiếu điều kiện hoặc sắp hết hạn
  function actAlert(d, me) {
    if ((me.tier || '') !== 'daily') return '';
    const a = ADB.activity(d, me.id), e = ADB.earnings(d, me.id);
    if (a.ok && a.left > 7) return '';
    if (a.ok) return `<div class="act-alert warn">${icon('clock')}<div>Còn <b>${a.left} ngày</b> là hết điều kiện nhận thu nhập từ đại lý tuyến dưới. Để giữ điều kiện, anh chị cần ${a.all ? 'thêm' : '1 trong 2 việc'}: <ul>${(a.all ? [a.buy, a.sell].filter(x => x.left === a.left) : [a.buy, a.sell]).map(x => `<li>${esc(x.label)}</li>`).join('')}</ul><a class="gold" href="#tong-quan" data-goact>Xem điều kiện</a></div></div>`;
    return `<div class="act-alert">${icon('info')}<div><b>Anh chị chưa đủ điều kiện nhận thu nhập từ đại lý tuyến dưới.</b>${e.held ? ` Đang giữ chờ ${ps(e.held)}.` : ''} ${a.all ? 'Còn thiếu' : 'Anh chị cần 1 trong 2 việc'}:<ul>${a.missing.map(x => `<li>${esc(x.label)} trong ${a.days} ngày gần nhất</li>`).join('')}</ul><a class="gold" href="san-pham.html">Mua hàng</a> · <a class="gold" href="#tong-quan" data-goact>Xem điều kiện</a></div></div>`;
  }

  /* ---------- TỔNG QUAN ---------- */
  function pOverview(box, d, me) {
    const P = ADB.plan(d), b = ADB.balances(d, me.id), e = ADB.earnings(d, me.id), tier = me.tier || 'khach';

</div>

        </div>

  /* ---------- vòng quay chào mừng: quay 1 lần sau khi đăng ký, trúng mã giảm giá ---------- */
  const cpOff = c => c.type === 'pct' ? `Giảm ${c.value}%${c.maxOff ? ', tối đa ' + money(c.maxOff) : ''}` : `Giảm ${money(c.value)}`;
  function welcomeCard(d, me) {
    const can = ADB.welcomeCan(d, me), list = ADB.couponsOf(d, me.id), now = today();
    if (!can && !list.length) return '';
    const st = c => c.status === 'used' ? `<span class="badge">Đã dùng${c.order ? ' · ' + esc(c.order) : ''}</span>` : c.expires && c.expires < now ? '<span class="badge failed">Hết hạn</span>' : '<span class="badge paid">Còn dùng được</span>';
    return `<div class="card glow-gold mt-2" id="ma-giam-gia">${head('Mã giảm giá của tôi', can ? 'Anh chị có 1 lượt quay chào mừng' : list.length + ' mã')}
      ${can ? `<div class="row wrap" style="gap:10px;align-items:center"><span class="stat-ico gold">${icon('gift')}</span><div style="flex:1;min-width:180px"><b>Quà chào mừng thành viên mới</b><div class="dim" style="font-size:13px">Quay 1 lần để nhận mã giảm giá cho đơn hàng.</div></div><button class="btn btn-gold" type="button" data-welcome>${icon('sparkle')} Quay nhận mã</button></div>` : ''}
      ${list.length ? `<div class="cp-list">${list.map(c => `<div class="cp-item${c.status !== 'new' || (c.expires && c.expires < now) ? ' off' : ''}"><div><b class="gold">${esc(c.code)}</b><small>${esc(cpOff(c))}${c.minOrder ? ' · đơn từ ' + money(c.minOrder) : ''}${c.expires ? ' · hạn ' + fdate(c.expires) : ''}</small></div>${st(c)}${c.status === 'new' ? `<button class="btn btn-sm" type="button" data-cpcopy="${esc(c.code)}">${icon('copy')} Sao chép</button>` : ''}</div>`).join('')}</div>
      <p class="dim mt-2" style="font-size:12.5px">Nhập mã ở bước xác nhận khi đặt hàng. Mỗi mã dùng 1 lần, đơn bị hủy thì mã được trả lại.</p>` : ''}</div>`;
  }
  function welcomeWheel() {
    const d = ADB.load(), me = ADB.user(d, ME); if (!ADB.welcomeCan(d, me)) return;
    const segs = ADB.welcomePrizes(d), n = segs.length, R = 150, C = 160;
    const pt = a => [C + R * Math.sin(a), C - R * Math.cos(a)];
    const face = segs.map((p, i) => {
      const a0 = i * 2 * Math.PI / n, a1 = (i + 1) * 2 * Math.PI / n, [x0, y0] = pt(a0), [x1, y1] = pt(a1), mid = (i + .5) * 360 / n;
      const path = n === 1 ? `<circle cx="${C}" cy="${C}" r="${R}" fill="${esc(p.color || '#f3c76b')}"/>` : `<path d="M${C} ${C}L${x0.toFixed(1)} ${y0.toFixed(1)}A${R} ${R} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}Z" fill="${esc(p.color || '#f3c76b')}" stroke="#0c1316" stroke-width="2"/>`;
      return path + `<g transform="rotate(${mid.toFixed(1)} ${C} ${C})"><text x="${C}" y="${C - R + 22}" text-anchor="middle" font-size="${n > 8 ? 11 : 13}" font-weight="700" fill="#0c1316" font-family="Be Vietnam Pro, sans-serif">${esc(p.label)}</text></g>`;
    }).join('');
    const md = modal(`<div class="card-head"><div><h3>Quà chào mừng thành viên mới</h3><div class="sub">Quay 1 lần, trúng mã giảm giá cho đơn hàng</div></div><button class="icon-btn" type="button" data-close style="margin-left:auto" aria-label="Để sau">${icon('close')}</button></div>
      <div class="ww"><div class="ww-ptr"></div><svg class="ww-face" viewBox="0 0 320 320" width="300" height="300"><circle cx="${C}" cy="${C}" r="${R + 6}" fill="#0c1316" stroke="#f3c76b" stroke-width="3"/>${face}<circle cx="${C}" cy="${C}" r="22" fill="#0c1316" stroke="#f3c76b" stroke-width="3"/></svg></div>
      <div id="wwOut" class="center mt-2"><button class="btn btn-gold" type="button" id="wwGo">${icon('sparkle')} Quay ngay</button><div class="dim mt-1" style="font-size:12.5px">Anh chị có thể đóng lại và quay sau ở mục Tổng quan.</div></div>`);
    md.el.querySelector('.modal').classList.add('ww-modal');
    const go = md.el.querySelector('#wwGo'), faceEl = md.el.querySelector('.ww-face'), out = md.el.querySelector('#wwOut');
    go.addEventListener('click', () => {
      go.disabled = true;
      const r = API.act('welcomeSpin', {});
      if (r.error) { out.innerHTML = `<p class="red">${esc(r.error)}</p>`; return; }
      const k = Math.max(0, segs.findIndex(p => p.id === r.prize.id)), seg = 360 / n;
      const deg = 360 * 6 + (360 - (k + .5) * seg) + (Math.random() - .5) * seg * .6;
      faceEl.style.transition = 'transform 4.2s cubic-bezier(.17,.67,.12,1)'; faceEl.style.transform = `rotate(${deg}deg)`;
      setTimeout(() => {
        const c = r.coupon;
        out.innerHTML = c ? `<div class="ww-win"><div class="dim">Chúc mừng anh chị đã trúng</div><h3 class="gold">${esc(r.prize.label)}</h3><div class="ww-code">${esc(c.code)}</div><div class="dim" style="font-size:12.5px">${esc(cpOff(c))}${c.minOrder ? ' · đơn từ ' + money(c.minOrder) : ''}${c.expires ? ' · dùng đến ' + fdate(c.expires) : ''}</div>
          <div class="row mt-2" style="justify-content:center;gap:8px"><button class="btn" type="button" data-cpc="${esc(c.code)}">${icon('copy')} Sao chép mã</button><a class="btn btn-gold" href="san-pham.html">${icon('cart')} Mua hàng ngay</a></div></div>` : `<div class="ww-win"><h3 class="gold">${esc(r.prize.label)}</h3><div class="dim">Cảm ơn anh chị đã tham gia.</div></div>`;
        const b = out.querySelector('[data-cpc]'); if (b) b.addEventListener('click', () => { navigator.clipboard && navigator.clipboard.writeText(b.dataset.cpc).catch(() => {}); toast('Đã sao chép mã ' + b.dataset.cpc); });
        md.el.addEventListener('click', e => { if (e.target === md.el || e.target.closest('[data-close]')) render(); });
        render();
      }, 4400);
    });
  }

        <ul>${perkLi(d, 'daily')}</ul></div>`;

  /* ---------- ĐĂNG KÝ ĐẠI LÝ NGAY (gói đại lý) ---------- */

    const P = ADB.plan(d), o = agentOrder(d, me.id), B = SITE.bank, spent = ADB.spent(d, me.id);
    if (me.tier === 'daily') {

    const intro = `<div class="card glow-gold">${head('Gói đại lý', 'lên Đại lý ngay, không cần chờ cộng dồn')}

      <ul class="pkg-list mt-2">${perkLi(d, 'dailyPkg')}</ul>

        <p class="muted" style="font-size:14px">Chuyển khoản: bấm nút bên dưới để tạo đơn, trang hiện thông tin chuyển khoản với nội dung là mã đơn. Hoặc trả bằng điểm khả dụng nếu ví đủ điểm.</p>

    });
  }

  /* ---------- DANH SÁCH ĐẠI LÝ ---------- */
  function pTeam(box, d, me) {

  /* ---------- KHÁCH HÀNG (người mình giới thiệu, chưa kích hoạt CTV) ---------- */
  function pCustomers(box, d, me) {

  // khách mua qua link của mình mà chưa có tài khoản (anh Tuân chốt 28/10): gọi, nhắn Zalo, gửi lời mời đăng ký đúng tuyến.
  // Khách đăng ký bằng đúng số điện thoại này thì đơn cũ tự gắn vào tài khoản và khách rời khỏi danh sách.

      ${g.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>Khách</th><th>Đơn đã đặt</th><th>Đã thanh toán</th><th>Lần mua gần nhất</th><th>Liên hệ</th></tr></thead><tbody>${g.map((x, i) => `<tr>
        <td><div class="who">${av(x, ['', 'v', 'g'][i % 3])}<div><b>${esc(x.name)}</b><small>${esc(x.phone)}</small></div></div></td>
        <td style="font-size:13px">${x.orders.map(o => `<div>#${esc(o.id)} ${statusBadge(o.status)}<br><span class="dim">${(o.items || []).map(it => esc(it.name) + ' x' + it.qty).join(', ')}</span></div>`).join('')}</td>
        <td class="gold nowrap">${money(x.paid)}</td><td class="dim nowrap">${fdate(x.last)}</td>
        <td><div class="row" style="gap:6px;flex-wrap:wrap">${tel(x.phone) ? `<a class="btn btn-sm btn-gold" href="tel:${tel(x.phone)}">${icon('phone')} Gọi</a><a class="btn btn-sm" href="https://zalo.me/${tel(x.phone)}" target="_blank" rel="noopener">${icon('zalo')} Zalo</a>` : ''}<button class="btn btn-sm btn-outline-gold" type="button" data-invite="${esc(invite(x))}">${icon('copy')} Lời mời đăng ký</button></div></td></tr>`).join('')}</tbody></table></div>`
      : `<div class="empty">${icon('user')}Chưa có khách nào. Khách mua qua đường dẫn của anh chị mà không đăng ký sẽ hiện ở đây.</div>`}</div>`;
  }
  function pLeader(box, d, me) {
    const L = ADB.leader(d, me.id), ranks = d.settings.leaderRanks, i = ranks.findIndex(r => r.id === L.rank.id), nx = ranks[i + 1];

        ${nx ? `<div class="mt-2" style="font-size:13px"><div class="row between"><span>Thành viên nhóm</span><span class="dim">${L.team}/${nx.minTeam}</span></div><div class="progress mt-1"><i style="width:${pc(L.team, nx.minTeam)}%"></i></div>
          <div class="row between mt-2"><span>Doanh số nhóm</span><span class="dim">${short(L.sales)}/${short(nx.minSales)}</span></div><div class="progress mt-1"><i style="width:${pc(L.sales, nx.minSales)}%"></i></div>
          <p class="dim mt-1">Để lên <b style="color:${nx.color}">${esc(nx.name)}</b>: còn ${[nx.minTeam > L.team ? (nx.minTeam - L.team) + ' người trong nhóm' : '', nx.minSales > L.sales ? money(nx.minSales - L.sales) + ' doanh số nhóm' : ''].filter(Boolean).join(' và ')}.</p></div>` : '<p class="gold mt-2">Anh chị đang ở cấp bậc cao nhất.</p>'}</div>
      <div class="card glow-gold">${ranks.map(r => `<div class="rank-line"><span class="rank-gem" style="color:${r.color}">${icon('star')}</span><b style="color:${r.color}">${esc(r.name)}${r.id === L.rank.id ? ' <span class="badge gold">Hiện tại</span>' : ''}</b><span class="dim" style="font-size:13px">${r.minTeam ? 'Từ ' + r.minTeam + ' người, doanh số nhóm ' + short(r.minSales) : 'Khi tham gia'}${r.bonus ? ' · thưởng ' + r.bonus + '%' : ''} (mẫu)</span></div>`).join('')}</div></div>`;
  }

  /* ---------- ĐƠN HÀNG ---------- */
  // đơn còn phải chuyển khoản (gói hoặc đơn hàng trả bằng chuyển khoản), chưa được công ty duyệt
  const due = o => Math.max(0, o.total - (o.shopPaid || 0) - (o.cashPaid || 0) - (o.availPaid || 0));
  const needPay = o => o.status === 'pending' && due(o) > 0 && (anyPkg(o) || o.pay === 'bank');
  function pOrders(box, d, me) {
    const O = d.orders.filter(o => o.userId === me.id).sort((a, b) => (b.date || '').localeCompare(a.date || '') || String(b.id).localeCompare(String(a.id)));
    box.innerHTML = ph('Đơn hàng của tôi', O.length + ' đơn') + `<div class="card glow-cyan">${head('Danh sách đơn', 'bấm vào một đơn để xem chi tiết', `<a class="btn btn-sm btn-gold" href="san-pham.html">${icon('bag')} Mua thêm</a>`)}
      ${O.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>Mã đơn</th><th>Sản phẩm</th><th>Tổng</th><th>Thanh toán</th><th>Trạng thái</th><th>Ngày</th></tr></thead><tbody>
        ${O.map(o => `<tr data-o="${esc(o.id)}" style="cursor:pointer"><td><b>#${esc(o.id)}</b></td><td class="dim">${(o.items || []).map(x => esc(x.name) + ' x' + x.qty).join('<br>')}</td><td class="gold nowrap">${money(o.total)}</td><td class="nowrap" style="font-size:13px">${esc(PAYN[o.pay] || o.pay || '')}${o.shopPaid ? `<br><span class="green">Điểm mua hàng ${ps(o.shopPaid)}</span>` : ''}${o.cashPaid ? `<br><span class="cyan">Ví tiền mặt ${money(o.cashPaid)}</span>` : ''}</td><td>${needPay(o) ? `<span class="badge pending">Chờ thanh toán</span><br><button class="btn btn-sm btn-gold mt-1 nowrap" type="button" data-pay="${esc(o.id)}">${icon('upload')} ${(o.bills || []).length ? 'Gửi lại bill' : 'Thanh toán / gửi bill'}</button>` : statusBadge(o.status)}</td><td class="dim nowrap">${fdate(o.date)}</td></tr>`).join('')}
      </tbody></table></div>` : `<div class="empty">${icon('bag')}Chưa có đơn hàng.<div class="mt-2"><a class="btn btn-gold btn-sm" href="san-pham.html">Chọn sản phẩm</a></div></div>`}</div>`;
    box.querySelectorAll('[data-o]').forEach(r => r.addEventListener('click', e => {
      const o = O.find(x => x.id === r.dataset.o), pay = needPay(o); if (pay && e.target.closest('[data-pay]') && !(o.bills || []).length) openBill = true;
      const md = modal(`<div class="card-head"><h3>Đơn #${esc(o.id)}</h3>${pay && !(o.bills || []).length ? '<span class="badge pending">Chờ thanh toán</span>' : statusBadge(o.status)}<button class="icon-btn" type="button" data-close style="margin-left:auto" aria-label="Đóng">${icon('close')}</button></div>
        ${(o.items || []).map(x => `<div class="row between" style="padding:6px 0;gap:10px"><span>${esc(x.name)} x${x.qty}</span><b class="nowrap">${money(x.price * x.qty)}</b></div>`).join('')}
        <div class="divider"></div>${o.shopPaid ? `<div class="row between"><span class="muted">Trả bằng ví điểm mua hàng</span><b class="green">${ps(o.shopPaid)}</b></div>` : ''}${o.cashPaid ? `<div class="row between"><span class="muted">Trả bằng ví tiền mặt</span><b class="cyan">${money(o.cashPaid)}</b></div>` : ''}<div class="row between mt-1"><span class="muted">Tổng</span><b class="gold">${money(o.total)}</b></div>
        <p class="dim mt-2" style="font-size:13px">Ngày đặt ${fdate(o.date)} · ${esc(PAYN[o.pay] || o.pay || '')}</p>
        ${pay ? `<div class="bank"><dl class="kv"><dt>Ngân hàng</dt><dd>${esc(SITE.bank.name)}</dd><dt>Số tài khoản</dt><dd><b class="gold">${esc(SITE.bank.account)}</b></dd><dt>Chủ tài khoản</dt><dd>${esc(SITE.bank.owner)}</dd><dt>Nội dung</dt><dd><b class="cyan">${esc(o.id)}</b></dd></dl>${PSQ.qr(due(o), o.id)}</div>${waitBox(o)}` : ''}`);
      if (pay) billWait('order', o, () => { md.close(); render(); }, 'Đã nhận thanh toán đơn ' + o.id, 'Cảm ơn anh chị! Nhân viên sẽ gọi xác nhận và giao hàng sớm nhất.');
    }));
  }

  /* ---------- VÍ ---------- */
  const WACT = { cash: [['deposit', 'Nạp tiền', 'plus'], ['topoints', 'Đổi sang điểm PS', 'gem'], ['withdraw', 'Rút về ngân hàng', 'download']], avail: [['transfer', 'Chuyển cho thành viên', 'users'], ['toshop', 'Sang ví mua hàng', 'bag']], sales: [['tocash', 'Rút sang ví tiền mặt', 'arrow']], bonus: [['convert', 'Chuyển sang ví khả dụng', 'arrow']], shop: [] };
  const GOLD = ['deposit', 'tocash', 'convert', 'transfer'];
  const byNewest = (x, y) => (y.date || '').localeCompare(x.date || '');
  function pWallet(box, d, me) {
    const b = ADB.balances(d, me.id), mine = (d.wallet || []).filter(w => w.user === me.id).sort(byNewest), P = ADB.plan(d);
    const held = k => -mine.filter(w => w.type === 'withdraw' && w.status === 'pending' && ADB.walletOf(w) === k).reduce((s, w) => s + w.amount, 0);
    box.innerHTML = ph('Ví của tôi', 'Ví tiền và ví hoa hồng tính bằng đồng, ba ví điểm tính bằng PS · 1đ = 1 PS · thuế thu nhập ' + P.taxRate + '% trừ khi rút hoa hồng và khi chuyển điểm thưởng') + note + `<section class="wgrid one-s">${WK.map(k => `<div class="wcard" style="--c:${W[k].color}"><span class="ico">${icon(W[k].icon)}</span><span class="amt">${wamt(k, b[k])}</span><span class="nm">${esc(W[k].name)}</span><small>${esc(wnote(k))}${held(k) ? `. Đang chờ rút ${wamt(k, held(k))}` : ''}</small>
        <div class="wfoot"><div class="acts">${WACT[k].map(([a, l, ic]) => `<button class="btn btn-sm${GOLD.includes(a) ? ' btn-gold' : ''}" type="button" data-wa="${a}">${icon(ic)} ${l}</button>`).join('') || `<button class="btn btn-sm" type="button" data-cart>${icon('cart')} Dùng khi đặt hàng</button>`}</div>${histBtn(k)}</div></div>`).join('')}</section>
      <div class="card glow-cyan mt-2">${head('Giao dịch gần đây', 'hoa hồng bán hàng, thưởng giới thiệu CTV, nạp và rút tiền', `<a class="card-link" href="#giao-dich">Xem tất cả</a>`)}${txTable(recentOf(mine).slice(0, 8))}</div>`;
  }
  // lịch sử từng ví, mới nhất trước, kèm số dư sau giao dịch
  function walletHist(k) {
    const d = ADB.load(), me = ADB.user(d, ME); if (!me || !W[k]) return;
    const rows = (d.wallet || []).map((w, i) => ({ w, i })).filter(({ w }) => w.user === me.id && ADB.walletOf(w) === k)
      .sort((x, y) => (x.w.date || '').localeCompare(y.w.date || '') || x.i - y.i);
    let run = 0; rows.forEach(r => { if (r.w.status === 'done' || (r.w.status === 'pending' && r.w.amount < 0)) run += r.w.amount; r.bal = run; });

  // cắt vuông ở giữa, thu về size px, JPEG 0,85
  function squareAvatar(file, size) {
    return new Promise((ok, fail) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        const s = Math.min(img.naturalWidth, img.naturalHeight); if (!s) { URL.revokeObjectURL(url); return fail(new Error('empty')); }
        const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
        g.fillStyle = '#0e1417'; g.fillRect(0, 0, size, size); g.imageSmoothingQuality = 'high';
        g.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
        URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => { URL.revokeObjectURL(url); fail(new Error('decode')); };
      img.src = url;
    });
  }

  /* ---------- nạp tiền vào ví tiền mặt ---------- */

  const bankBox = (u, a) => `<dl class="kv dep-bank"><dt>Ngân hàng</dt><dd>${esc(SITE.bank.name)}</dd><dt>Số tài khoản</dt><dd><b class="gold">${esc(SITE.bank.account)}</b></dd><dt>Chủ tài khoản</dt><dd>${esc(SITE.bank.owner)}</dd>${a ? `<dt>Số tiền</dt><dd><b>${money(a)}</b></dd>` : ''}<dt>Nội dung</dt><dd><b class="cyan">${esc(depCode(u))}</b> <button class="link-btn" type="button" data-copy-dep="${esc(depCode(u))}">Sao chép</button></dd></dl>${a ? PSQ.qr(a, depCode(u)) : ''}`;

  /* ---------- thao tác ví (hộp thoại) ---------- */
  function walletAct(kind) {
    if (kind === 'deposit') return depositAct();
    const d = ADB.load(), me = ADB.user(d, ME), P = ADB.plan(d), b = ADB.balances(d, me.id), min = d.settings.minWithdraw || 0, tx = P.taxRate;
    const cfg = {

      withdraw: { t: 'Rút về ngân hàng', from: 'cash', sub: `Từ ví tiền mặt, tối thiểu ${money(min)}. Hoa hồng, thưởng giới thiệu và thu nhập tuyến dưới trong ví tiền mặt trừ thuế thu nhập khi rút. Tiền nạp và tiền đã trừ thuế từ ví hoa hồng cũ không trừ nữa.` },
      convert: { t: 'Chuyển điểm thưởng sang khả dụng', from: 'bonus', sub: `Trừ thuế ${tx}% khi chuyển.` },
      topoints: { t: 'Đổi tiền mặt sang điểm PS', from: 'cash', sub: '1đ = 1 PS, không mất phí, không trừ thuế. Điểm vào ví điểm khả dụng.' },
      toshop: { t: 'Chuyển sang ví mua hàng', from: 'avail', sub: 'Không mất phí. Điểm mua hàng chỉ dùng thanh toán đơn trên web.' },
      transfer: { t: 'Chuyển điểm cho thành viên', from: 'avail', sub: 'Từ ví điểm khả dụng của anh chị sang ví điểm khả dụng của người nhận.' }
    }[kind];
    const max = Math.max(0, b[cfg.from]), tax = a => Math.round(a * tx / 100);
    const md = modal(`<form id="waF" novalidate>
      <div class="card-head"><div><h3>${cfg.t}</h3><div class="sub">${cfg.sub}</div></div><button class="icon-btn" type="button" data-close style="margin-left:auto" aria-label="Đóng">${icon('close')}</button></div>
      <div class="row between wa-bal" style="--c:${W[cfg.from].color};gap:10px"><span class="dim">${esc(W[cfg.from].name)}</span><b class="nowrap">${wamt(cfg.from, max)}</b></div>
      ${kind === 'transfer' ? `<div class="field mt-2"><label for="waU">Tên truy cập người nhận</label><input class="input" id="waU" name="user" autocomplete="off" autocapitalize="off" placeholder="Ví dụ khach2"><div class="wa-prev" id="waP"></div></div>` : ''}
      <div class="field mt-2"><label for="waA">${kind === 'withdraw' ? 'Số tiền rút về ngân hàng (đồng)' : kind === 'tocash' ? 'Số tiền rút (đồng)' : kind === 'topoints' ? 'Số tiền đổi (đồng)' : 'Số điểm'}</label><div class="row" style="gap:8px"><input class="input" id="waA" name="amount" type="number" min="1" step="1000" inputmode="numeric" style="flex:1;min-width:0"><button class="btn btn-sm" type="button" id="waMax">Tối đa</button></div></div>
      ${kind === 'withdraw' ? `<div class="form-grid mt-2"><div class="field"><label for="waB">Ngân hàng</label><input class="input" id="waB" name="bank" placeholder="Ví dụ Vietcombank"></div><div class="field"><label for="waN">Số tài khoản, tên chủ tài khoản</label><input class="input" id="waN" name="account"></div></div>` : ''}
      ${kind === 'transfer' ? `<div class="field mt-2"><label for="waT">Lời nhắn (nếu có)</label><input class="input" id="waT" name="note" maxlength="80"></div>` : ''}
      <dl class="calc mt-2" id="waC"></dl>
      <p class="red mt-1" id="waE" style="font-size:13px;min-height:18px"></p>
      ${kind === 'withdraw' && max < min ? `<p class="dim" style="font-size:12.5px">Số dư chưa đủ mức rút tối thiểu ${money(min)}.</p>` : ''}
      <div class="row" style="justify-content:flex-end;gap:8px"><button class="btn" type="button" data-close>Hủy</button><button class="btn btn-gold" type="submit" id="waS"${kind === 'withdraw' && max < min ? ' disabled' : ''}>${kind === 'transfer' ? 'Tiếp tục' : 'Xác nhận'}</button></div></form>`);
    const el = md.el, F = $('#waF', el), A = $('#waA', el), E = $('#waE', el), C = $('#waC', el), S = $('#waS', el);
    // người nhận: tra trên máy chủ (trang chỉ có dữ liệu của mình và tuyến dưới)
    let rcptU = null;

    const calc = () => {
      const a = Math.max(0, Math.round(+A.value || 0)), kv = r => r.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
      F.dataset.ok = ''; C.classList.remove('ok'); if (kind === 'transfer') S.textContent = 'Tiếp tục';

        : kind === 'withdraw' ? (() => { const t = ADB.withdrawTax(d, me.id, Math.min(a, max)); return kv([['Trừ ví tiền mặt', money(a)], [`Thuế thu nhập ${tx}%`, t.tax ? '<span class="red">-' + money(t.tax) + '</span>' : '0đ'], ['Thực nhận (công ty chuyển khoản)', '<span class="green">' + money(a - t.tax) + '</span>'], ['Số dư còn lại', money(max - a)]]); })()
        : kind === 'convert' ? kv([['Trừ ví điểm thưởng', ps(a)], [`Thuế ${tx}%`, '<span class="red">-' + ps(tax(a)) + '</span>'], ['Vào ví điểm khả dụng', '<span class="green">' + ps(a - tax(a)) + '</span>']])

        }
        r = act('wallet', { kind, amount: a, user: name, note: msg }, r => 'Đã chuyển ' + ps(a) + ' cho ' + r.to.name, E); if (!r) return;
      }
      md.close(); render();
    });
    setTimeout(() => (U || A).focus(), 60);
  }

          <div class="field mt-2"><label for="fu">Tên truy cập</label><input class="input" id="fu" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" maxlength="30" placeholder="Ví dụ minhanh2026"><small class="dim" id="fuHint" style="font-size:12px;min-height:16px;display:block;margin-top:4px">Chữ thường không dấu, số, dấu chấm hoặc gạch dưới. Để trống thì hệ thống tự tạo.</small></div>
          <div class="field mt-2"><label for="fp">Số điện thoại</label><input class="input" id="fp" name="phone" type="tel" autocomplete="tel" inputmode="tel"></div>` : ''}
          ${mode === 'reset' ? '' : `<div class="field mt-2"><label for="fe">${mode === 'login' ? 'Email hoặc tên truy cập' : 'Email'}</label><input class="input" id="fe" name="email" type="${mode === 'login' ? 'text' : 'email'}" autocomplete="${mode === 'login' ? 'username' : 'email'}" autocapitalize="off" spellcheck="false" required></div>`}
          ${mode === 'forgot' ? '' : `<div class="field mt-2"><label for="fw">${mode === 'reset' ? 'Mật khẩu mới' : 'Mật khẩu'}</label><input class="input" id="fw" name="pass" type="password" autocomplete="${mode === 'login' ? 'current-password' : 'new-password'}" minlength="6" required></div>`}
          ${mode === 'reset' || mode === 'register' ? `<div class="field mt-2"><label for="fw2">${mode === 'reset' ? 'Nhập lại mật khẩu mới' : 'Nhập lại mật khẩu'}</label><input class="input" id="fw2" name="pass2" type="password" autocomplete="new-password" minlength="6" required><small class="dim" id="fw2Hint" style="font-size:12px;min-height:16px;display:block;margin-top:4px"></small></div>` : ''}
          ${mode === 'register' ? `<div class="field mt-2"><div class="fr-head"><label for="fr">Mã giới thiệu <span class="red">*</span></label><a class="dl-glow" href="dai-ly.html" target="_blank" rel="noopener">${icon('award')} Đại lý uy tín</a></div><input class="input" id="fr" name="ref" autocomplete="off" required placeholder="Hãy liên hệ người giới thiệu bạn để lấy mã số, hoặc chọn một trong những đại lý uy tín" title="Hãy liên hệ người giới thiệu bạn để lấy mã số, hoặc chọn một trong những đại lý uy tín." value="${esc(refCode)}" style="text-transform:uppercase"><small class="dim" id="frHint" style="font-size:12px;min-height:16px;display:block;margin-top:4px"></small></div>
          <div class="terms-h mt-2"><b>${icon('shield')} Điều khoản sử dụng</b><small id="termsHint">Cuộn đọc hết để đồng ý</small></div>
          <div class="terms-box" id="termsBox"><div class="terms" id="terms" tabindex="0" role="document" aria-label="Điều khoản sử dụng">${termsHtml(P)}</div></div>
          <label class="check mt-2 terms-ok"><input type="checkbox" name="agree" id="agree" required disabled> Tôi đã đọc và đồng ý với điều khoản sử dụng và chính sách bảo mật</label>` : ''}
          <p class="red mt-1" id="err" style="font-size:13px;min-height:20px"></p>
          <button class="btn btn-gold btn-block btn-lg" type="submit">${{ login: 'Đăng nhập', register: 'Tạo tài khoản', forgot: 'Gửi đường dẫn đặt lại', reset: 'Lưu mật khẩu mới' }[mode]}</button>
          <p class="dim mt-2" style="font-size:12.5px">${mode === 'login' ? '<button type="button" class="link gold" data-m="forgot" style="background:none;border:0;padding:0;cursor:pointer;font:inherit">Quên mật khẩu?</button>' : mode === 'register' ? 'Mật khẩu tối thiểu 6 ký tự.' : '<button type="button" class="link gold" data-m="login" style="background:none;border:0;padding:0;cursor:pointer;font:inherit">Quay lại đăng nhập</button>'}</p>
        </form>
        <div class="divider"></div>
        <h3 style="font-size:15px">Cấp bậc thành viên</h3>
        <div class="mt-1">${tiers.map(([k, ic, t, perks]) => `<div class="rank-line"><span class="rank-gem" style="color:${T[k].color}">${icon(ic)}</span><b style="color:${T[k].color}">${esc(T[k].name)} <small class="dim" style="font-weight:500;font-size:12.5px">· ${esc(t)}</small></b><ul class="tier-perks" style="--c:${T[k].color}">${perks.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div>
      </div>
    </div>`;
    if (!view.dataset.gm) { view.dataset.gm = 1; view.addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (b && !ME) guest(b.dataset.m); }); }
    // mã giới thiệu, tên truy cập: kiểm tra trên máy chủ (chờ ngừng gõ một chút)
    const later = (fn, ms = 350) => { let t; return () => { clearTimeout(t); t = setTimeout(fn, ms); }; };
    const fr = $('#fr');
    // chữ gợi ý trong ô: ô hẹp thì dùng câu ngắn hơn để không bị cắt
    if (fr && fr.clientWidth) fr.placeholder = fr.clientWidth >= 640 ? fr.placeholder : fr.clientWidth >= 420 ? 'Hãy liên hệ người giới thiệu để lấy mã, hoặc chọn đại lý uy tín' : 'Hỏi người giới thiệu lấy mã hoặc chọn đại lý uy tín';
    if (fr) { const hint = () => { const c = fr.value.trim().toUpperCase(), r = c ? API.act('checkRef', { code: c }) : {};
      if (!$('#frHint')) return; $('#frHint').innerHTML = !c ? '' : r.name ? `Người giới thiệu: <b class="gold">${esc(r.name)}</b>` : `<span class="red">${esc(r.error || 'Mã giới thiệu chưa đúng.')}</span>`; };
      fr.addEventListener('input', later(hint)); if (fr.value) hint(); }
    // nhập lại mật khẩu: báo ngay khi chưa khớp
    const fw = $('#fw'), fw2 = $('#fw2');
    if (fw && fw2) { const same = () => { const h = $('#fw2Hint'); if (!h) return; h.innerHTML = !fw2.value ? '' : fw.value === fw2.value ? '<span class="green">Mật khẩu khớp ✓</span>' : '<span class="red">Chưa khớp với mật khẩu ở trên.</span>'; }; fw.addEventListener('input', same); fw2.addEventListener('input', same); }
    const fu = $('#fu'), unameErr = v => { if (!v) return ''; if (!UNAME.test(v)) return 'Tên truy cập dài 3 đến 30 ký tự, chỉ gồm a-z, 0-9, dấu chấm, gạch dưới.'; const r = API.act('checkUsername', { username: v }); return r.error || ''; };
    if (fu) fu.addEventListener('input', later(() => { const v = fu.value.trim().toLowerCase(), er = unameErr(v);
      if (!$('#fuHint')) return; $('#fuHint').innerHTML = !v ? 'Chữ thường không dấu, số, dấu chấm hoặc gạch dưới. Để trống thì hệ thống tự tạo.' : er ? `<span class="red">${er}</span>` : `<span class="green">Dùng được: @${esc(v)}</span>`; }));
    // điều khoản: phải kéo đọc tới cuối thì ô đồng ý mới bấm được
    const tm = $('#terms'); if (tm) { const ag = $('#agree'), seen = () => { if (tm.scrollTop + tm.clientHeight >= tm.scrollHeight - 12) { ag.disabled = false; $('#termsBox').classList.add('end'); $('#termsHint').textContent = 'Đã đọc hết ✓'; $('#termsHint').classList.add('green'); tm.removeEventListener('scroll', seen); } }; tm.addEventListener('scroll', seen, { passive: true }); seen(); }
    $('#af').addEventListener('submit', e => {
      e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)), err = $('#err'), btn = e.target.querySelector('[type=submit]');
      let wanted;
      if (mode === 'forgot') {
        btn.disabled = true; const r = API.act('forgot', { email: (f.email || '').trim() }); btn.disabled = false;
        if (r.error) return err.textContent = r.error;
        err.innerHTML = `<span class="green">Nếu email này đã đăng ký, đường dẫn đặt lại mật khẩu đã được gửi. Anh chị mở hộp thư (cả mục Thư rác) để đặt mật khẩu mới.</span>`; return;
      }
      if (mode === 'reset') {
        if ((f.pass || '').length < 6) return err.textContent = 'Mật khẩu mới cần ít nhất 6 ký tự.';
        if (f.pass !== f.pass2) return err.textContent = 'Hai lần nhập mật khẩu chưa khớp.';
        const r = API.act('resetPass', { token: PSQ.qs('dat-lai'), pass: f.pass }); if (r.error) return err.textContent = r.error;
        toast('Đã đặt mật khẩu mới'); location.href = r.user && r.user.role === 'admin' ? 'quan-tri.html' : 'thanh-vien.html'; return;
      }
      if (mode === 'register') {
        if (!f.name || !f.email || !f.pass) return err.textContent = 'Anh chị điền đủ họ tên, email và mật khẩu.';
        wanted = (f.username || '').trim().toLowerCase(); const ue = unameErr(wanted); if (ue) return err.textContent = ue;
        if (f.pass.length < 6) return err.textContent = 'Mật khẩu tối thiểu 6 ký tự.';
        if (f.pass !== f.pass2) { $('#fw2').focus(); return err.textContent = 'Hai lần nhập mật khẩu chưa khớp, anh chị nhập lại giúp em.'; }
        if (!f.agree) return err.textContent = 'Anh chị cần đồng ý với điều khoản.';
      }
      btn.disabled = true;
      const r = mode === 'login' ? auth.login(f.email, f.pass) : API.act('register', { name: f.name, username: wanted || '', phone: f.phone, email: f.email, pass: f.pass, ref: f.ref, agree: !!f.agree });
      btn.disabled = false;
      if (r.error) {
        err.textContent = r.error;
        if (/chưa kích hoạt/.test(r.error)) { err.insertAdjacentHTML('beforeend', ' <button type="button" class="link gold" id="rsV" style="background:none;border:0;padding:0;cursor:pointer;font:inherit">Gửi lại thư kích hoạt</button>'); $('#rsV').addEventListener('click', () => { const x = API.act('resendVerify', { email: (f.email || '').trim() }); toast(x.error || 'Đã gửi lại thư kích hoạt, anh chị mở hộp thư (cả mục Thư rác).', x.error ? 'err' : undefined); }); }
        return;
      }
      if (mode === 'register') return registered(r, f);
      location.href = 'thanh-vien.html' + location.hash;
    });
  }

  // màn hình sau khi tạo tài khoản: chờ kích hoạt qua email, hoặc vào trang thành viên ngay (khi chưa cài email gửi thư)
  function registered(r, f) {
    const wait = r.needVerify;
    view.innerHTML = `<div class="card glow-mix" style="max-width:560px;margin:24px auto;padding:clamp(22px,4vw,36px);text-align:center">
      <span class="pw-ok" style="margin:0 auto 14px;width:56px;height:56px" aria-hidden="true">${icon('check')}</span>
      <h2 class="display" style="font-size:clamp(24px,3vw,32px)">Đăng ký thành công!</h2>
      ${wait ? `<p class="mt-2">Em đã gửi thư kích hoạt tới email:</p>
      <p class="mt-1" style="font-size:clamp(17px,2.4vw,20px);word-break:break-all"><b class="gold" id="rgMail">${esc(r.email)}</b></p>
      <p class="mt-1">Anh chị mở thư và bấm nút <b>Kích hoạt tài khoản</b> để bắt đầu sử dụng.</p>
      <p class="mt-2" style="font-size:14px"><button type="button" class="link gold" id="rgFix" style="background:none;border:0;padding:0;cursor:pointer;font:inherit;text-decoration:underline">Email trên bị sai? Sửa lại</button></p>
      <form id="rgFixF" class="mt-2" hidden style="max-width:380px;margin-left:auto;margin-right:auto;text-align:left"><label class="dim" style="font-size:13px" for="rgNew">Email đúng của anh chị</label>
        <div class="row mt-1" style="gap:8px"><input class="input" id="rgNew" type="email" inputmode="email" autocomplete="email" required style="flex:1;min-width:0"><button class="btn btn-gold" type="submit">Gửi lại</button></div></form>
      <div class="dim mt-3" style="font-size:13px;text-align:left;max-width:420px;margin-left:auto;margin-right:auto;line-height:1.6"><b>Không thấy thư?</b><br>1. Mở đúng Gmail vừa nhập ở trên (nhiều người có 2 Gmail).<br>2. Xem cả mục <b>Quảng cáo</b>, <b>Cập nhật</b>, <b>Thư rác</b> hoặc <b>Tất cả thư</b>.<br>3. Gõ <b>Phúc Sinh QuanTum</b> vào ô tìm kiếm Gmail.<br>4. Đợi 2 đến 3 phút rồi mới bấm gửi lại. Chỉ dùng thư mới nhất, đường dẫn dùng được 72 giờ.<br>Vẫn không được, anh chị gọi <a class="gold" href="tel:${esc(SITE.phone.replace(/\D/g, ''))}">${esc(SITE.phone)}</a> để được kích hoạt ngay.</div>
      <div class="row mt-3" style="gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn btn-gold" type="button" id="rgRe">${icon('upload')} Gửi lại thư kích hoạt</button><a class="btn btn-outline-gold" href="thanh-vien.html">Về trang đăng nhập</a></div>`
      : `<p class="mt-2">Chào mừng <b class="gold">${esc(f.name)}</b> đến với ${esc(SITE.brand)}. Tài khoản của anh chị đã sẵn sàng.</p>
      <div class="row mt-3" style="justify-content:center"><a class="btn btn-gold" href="thanh-vien.html#tong-quan">${icon('user')} Vào trang thành viên</a></div>`}
    </div>`;
    scrollTo({ top: 0, behavior: 'smooth' });
    const b = $('#rgRe'); if (b) b.addEventListener('click', () => { b.disabled = true; const x = API.act('resendVerify', { email: r.email }); toast(x.error || 'Đã gửi lại thư kích hoạt', x.error ? 'err' : undefined); setTimeout(() => { b.disabled = false; }, 60e3); });
    const fx = $('#rgFix'), ff = $('#rgFixF');
    if (fx) fx.addEventListener('click', () => { ff.hidden = !ff.hidden; if (!ff.hidden) { $('#rgNew').value = r.email; $('#rgNew').focus(); } });
    if (ff) ff.addEventListener('submit', e => { e.preventDefault(); const ne = $('#rgNew').value.trim();
      const x = API.act('fixVerifyEmail', { email: r.email, pass: f.pass, newEmail: ne });
      if (x.error) return toast(x.error, 'err');
      r.email = x.email; $('#rgMail').textContent = x.email; ff.hidden = true; toast('Đã sửa email và gửi thư kích hoạt tới ' + x.email); });
  }
  if (PSQ.qs('da-kich-hoat')) { history.replaceState(null, '', 'thanh-vien.html#tong-quan'); toast('Đã kích hoạt tài khoản, chào mừng anh chị!'); }
  // mở đường dẫn kích hoạt trong thư
  let verifyErr = '';
  if (PSQ.qs('kich-hoat')) {
    const r = API.act('verifyEmail', { token: PSQ.qs('kich-hoat') });
    // vẽ luôn trang thành viên tại chỗ (trước đây chuyển sang cùng trang chỉ khác #, trình duyệt không tải lại nên trang đứng im)
    history.replaceState(null, '', r.error ? 'thanh-vien.html' : 'thanh-vien.html#tong-quan');
    if (r.error) verifyErr = r.error; else toast('Đã kích hoạt tài khoản, chào mừng anh chị!');
  }

  const u = auth.user();
  if (PSQ.qs('dat-lai')) guest('reset');
  else if (!u && location.hash === '#quen-mat-khau') guest('forgot');
  else if (u) { ME = u.id; member(); }
  else guest(PSQ.qs('dang-ky') || PSQ.qs('ref') ? 'register' : 'login');
  if (verifyErr) { toast(verifyErr, 'err'); const e = $('#err'); if (e) e.innerHTML = `<span class="red">${esc(verifyErr)}</span>`; }
})();
</script>
</body>
</html>
