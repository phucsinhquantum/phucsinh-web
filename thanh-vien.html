<script>

  const W = ADB.WALLETS, WK = ['cash', 'avail', 'sales', 'bonus', 'shop'].filter(k => W[k]).concat(Object.keys(W).filter(k => !['cash', 'avail', 'sales', 'bonus', 'shop'].includes(k)));
  const ps = n => (Math.round(n) || 0).toLocaleString('vi-VN') + ' PS';
  const WST = { done: ['Hoàn tất', 'ok'], pending: ['Chờ duyệt', 'pending'], rejected: ['Từ chối', 'failed'] };
  const wB = s => `<span class="badge ${(WST[s] || [])[1] || ''}">${(WST[s] || [s])[0]}</span>`;
  const tierB = u => { const t = ADB.tierOf(u); return `<span class="badge tier-b" style="--c:${t.color}">${icon((u.tier || 'khach') === 'daily' ? 'award' : (u.tier || 'khach') === 'ctv' ? 'star' : 'user')} ${esc(t.name)}</span>`; };

  const av = (u, cls = '') => `<span class="avatar ${cls}">${u && u.avatar ? `<img src="${esc(u.avatar)}" alt="">` : esc(initials((u && u.name) || ''))}</span>`;
  const wamt = (k, n) => (W[k] && W[k].unit === 'vnd') ? money(n) : ps(n);
  const wnote = k => { const t = (ADB.load().settings.plan || {}).taxRate ?? 10; return k === 'sales' ? 'Hoa hồng bằng tiền, rút sang ví tiền mặt trừ thuế thu nhập ' + t + '%' : k === 'bonus' ? 'Thu nhập từ đại lý tuyến dưới, chuyển sang ví khả dụng trừ thuế ' + t + '%' : W[k].note; };
  const lower1 = s => s.charAt(0).toLowerCase() + s.slice(1);
  const histBtn = k => `<button class="icon-btn whist" type="button" data-wh="${k}" aria-label="Lịch sử ${esc(lower1(W[k].name))}" title="Lịch sử giao dịch">${icon('clock')}</button>`;
  // giao dịch gần đây: chỉ hoa hồng bán hàng, thưởng giới thiệu CTV, lệnh nạp và rút tiền
  const RECENT = ['commission', 'referral', 'topup', 'withdraw', 'tocash'];
  const recentOf = rows => rows.filter(w => RECENT.includes(w.type) && !(w.type === 'tocash' && ADB.walletOf(w) === 'cash'));
  const isKhach = u => (u.tier || 'khach') === 'khach' && u.role !== 'admin';
  const refLinkOf = u => location.origin + location.pathname + '?ref=' + encodeURIComponent(u.code || '');
  const khachNote = (act = true) => `<p class="khach-note">${icon('info')}<span>Tài khoản khách hàng vẫn giới thiệu được người khác nhưng chưa nhận hoa hồng. Kích hoạt CTV để bắt đầu nhận hoa hồng.${act ? ' <a class="gold" href="#kich-hoat">Kích hoạt CTV</a>' : ''}</span></p>`;
  async function copyFrom(inp) {
    if (!inp) return;
    try { await navigator.clipboard.writeText(inp.value); } catch (e) { inp.select(); try { document.execCommand('copy'); } catch (er) {} }
    toast('Đã sao chép đường dẫn giới thiệu');
  }
  const save = (d, action, detail, msg) => { ADB.log(d, action, detail); ADB.save(d); toast(msg); };
  const head = (t, sub, right = '') => `<div class="card-head" style="flex-wrap:wrap"><div><h3>${t}</h3>${sub ? `<div class="sub">${sub}</div>` : ''}</div>${right ? `<div style="margin-left:auto">${right}</div>` : ''}</div>`;
  const ph = (t, sub) => `<div class="tv-ph"><h2>${t}</h2>${sub ? `<p class="dim">${sub}</p>` : ''}</div>`;
  const note = `<p class="biz-note">${icon('info')}Bản chạy thử: nạp tiền được xác nhận ngay, rút tiền do kế toán lập lệnh và công ty duyệt, chưa chuyển tiền thật.</p>`;
  const pctOf = (v, t) => t > 0 ? Math.round(v / t * 100) : 0;
  const isPkg = o => (o.items || []).some(x => x.id === ADB.PKG_ID);
  const pkgOrder = (d, id) => d.orders.find(o => o.userId === id && o.status !== 'failed' && isPkg(o));
  const PAYN = { bank: 'Chuyển khoản', cod: 'Thanh toán khi nhận hàng', shop: 'Ví điểm mua hàng', wallet: 'Thanh toán bằng ví' };

  /* ---------- tên truy cập ---------- */
  const UNAME = /^[a-z0-9._]{3,30}$/;
  const unameTaken = (d, n, self) => d.users.some(u => u.id !== self && ((u.username || '').toLowerCase() === n || (u.code || '').toLowerCase() === n));
  const autoUname = (d, u) => { let b = String(u.email || u.code || 'tv').split('@')[0].toLowerCase().replace(/[^a-z0-9._]/g, '') || 'tv', n = b, k = 1; while (unameTaken(d, n, u.id)) n = b + (++k); return n; };
  // tài khoản mới đăng ký chưa có tên truy cập / cấp bậc: bổ sung
  function ensureMember(id, wanted) {
    const d = ADB.load(), u = ADB.user(d, id); if (!u) return;
    let ch = false;
    if (wanted && UNAME.test(wanted) && !unameTaken(d, wanted, u.id)) { u.username = wanted; ch = true; }

  /* ---------- menu ---------- */
  let ME = null;
  const MENU = (d, me) => [
    ['', [['tong-quan', 'Tổng quan', 'grid'], (me.tier || 'khach') === 'khach' && ['kich-hoat', 'Kích hoạt CTV', 'sparkle'], ['dai-ly', 'Danh sách đại lý', 'users'], ['khach-hang', 'Khách hàng', 'user'], ['lanh-dao', 'Cấp bậc lãnh đạo', 'star']].filter(Boolean)],
    ['Mua hàng', [['san-pham', 'Sản phẩm', 'bag'], ['gio-hang', 'Giỏ hàng', 'cart'], ['don-hang', 'Đơn hàng của tôi', 'truck']]],
    ['Tài chính', [['vi', 'Ví của tôi', 'wallet'], ['giao-dich', 'Giao dịch của tôi', 'activity'], ['hoa-hong', 'Hoa hồng', 'award'], ['nap-diem', 'Nạp tiền', 'plus']]],

  function member() {
    view.innerHTML = `<div class="tv-layout">

  const route = () => location.hash.slice(1) || 'tong-quan';

  function render() {
    const d = ADB.load(), me = ADB.user(d, ME); if (!me) { auth.logout(); return location.reload(); }

    $('#tvMe').innerHTML = `${av(me, 'g')}<div><b>${esc(me.name)}</b>@${esc(me.username || '')} · <span style="color:${ADB.tierOf(me).color}">${esc(ADB.tierOf(me).name)}</span></div>`;
    $('#tvNav').innerHTML = (me.role === 'admin' ? `<a href="quan-tri.html">${icon('shield')}<span>Trang quản trị</span></a>` : '') + menu.map(([g, list]) => (g ? `<h4>${esc(g)}</h4>` : '') + list.map(([id, l, ic]) => ACTIONS[id]

  const list = menu => menu.flatMap(g => g[1].map(x => x[0]));

  /* ---------- điều kiện nhận thu nhập từ đại lý tuyến dưới ---------- */
  const MODE_NOTE = { hold: n => `Chưa đủ điều kiện thì khoản 40% được giữ lại tối đa ${n} ngày, đủ điều kiện trong thời gian này sẽ tự vào ví.`, lose: () => 'Chưa đủ điều kiện thì khoản 40% phát sinh trong thời gian đó không được nhận.', up: () => 'Chưa đủ điều kiện thì khoản 40% chuyển cho đại lý đủ điều kiện ở tuyến trên.' };
  const actItem = (x, P, a) => { const na = !x.ok && a && a.ok && !a.all; return `<li class="${x.ok ? 'ok' : na ? 'na' : 'no'}"><i>${x.ok ? '✓' : na ? '–' : '!'}</i><div><b>${esc(x.label)}${x === 'buy' ? '' : ''}</b><small>${x.ok ? `Gần nhất ${fdate(x.last)} · ${x.count} đơn trong ${P.activeDays} ngày` : `Chưa có trong ${P.activeDays} ngày gần nhất`}</small></div>${x.ok ? `<span class="badge ${x.left <= 7 ? 'pending' : 'paid'}">Còn ${x.left} ngày</span>` : a && a.ok && !a.all ? '<span class="badge">Không bắt buộc</span>' : '<span class="badge failed">Thiếu</span>'}</li>`; };
  function actCard(d, me) {

    const min = [P.activeMinBuy ? `đơn tự mua từ ${money(P.activeMinBuy)}` : '', P.activeMinSell ? `đơn bán từ ${money(P.activeMinSell)}` : ''].filter(Boolean).join(', ');
    return `<div class="card ${a.ok ? 'glow-cyan' : 'glow-gold'} mt-2" id="dieu-kien">${head('Điều kiện nhận thu nhập từ đại lý tuyến dưới', a.ok ? `Đang đủ điều kiện · còn ${a.left} ngày` : a.all ? `Còn thiếu ${a.missing.length} điều kiện` : 'Chưa đủ điều kiện, cần 1 trong 2 việc bên dưới')}

      <p class="dim mt-2" style="font-size:12.5px">Trong ${P.activeDays} ngày gần nhất, đại lý cần có ${a.all ? 'cả đơn tự mua và đơn bán' : 'đơn tự mua hoặc đơn bán (chỉ cần 1 trong 2)'} (đơn bán là người mình giới thiệu trực tiếp mua), đã thanh toán${min ? ` (${min})` : ''}. ${MODE_NOTE[P.overrideMode] ? MODE_NOTE[P.overrideMode](P.holdDays) : ''} Hoa hồng bán hàng ${P.agentRate}% không bị ảnh hưởng.</p></div>`;
  }
  // cảnh báo đầu trang khi thiếu điều kiện hoặc sắp hết hạn
  function actAlert(d, me) {
    if ((me.tier || '') !== 'daily') return '';

    return `<div class="act-alert">${icon('info')}<div><b>Anh chị chưa đủ điều kiện nhận thu nhập từ đại lý tuyến dưới.</b>${e.held ? ` Đang giữ chờ ${ps(e.held)}.` : ''} ${a.all ? 'Còn thiếu' : 'Anh chị cần 1 trong 2 việc'}:<ul>${a.missing.map(x => `<li>${esc(x.label)} trong ${a.days} ngày gần nhất</li>`).join('')}</ul><a class="gold" href="san-pham.html">Mua hàng</a> · <a class="gold" href="#tong-quan" data-goact>Xem điều kiện</a></div></div>`;

  /* ---------- TỔNG QUAN ---------- */
  function pOverview(box, d, me) {
    const P = ADB.plan(d), b = ADB.balances(d, me.id), e = ADB.earnings(d, me.id), tier = me.tier || 'khach';
    const C = (d.commissions || []).filter(c => c.user === me.id && c.kind !== 'missed' && !['hold', 'missed', 'cancel'].includes(c.status));
    const months = [...Array(6)].map((_, i) => { const t = new Date(); t.setDate(1); t.setMonth(t.getMonth() - 5 + i); return t.toISOString().slice(0, 7); });

    const spent = ADB.spent(d, me.id);

          <div class="row wrap mt-1" style="gap:8px">${tierB(me)}<span class="dim" style="font-size:12.5px">Mã giới thiệu <b class="gold">${esc(me.code || '')}</b></span></div>
</div>
        <div class="acts"><a class="btn btn-sm btn-outline-gold" href="#don-hang">${icon('truck')} Đơn hàng</a><a class="btn btn-sm" href="#giao-dich">${icon('activity')} Giao dịch</a></div>

      </section>

      ${(me.tier || '') === 'daily' ? actCard(d, me) : ''}
      <section class="wgrid mt-2">${WK.map(k => `<div class="wcard" style="--c:${W[k].color}"><a class="wlink" href="#vi" aria-label="${esc(W[k].name)}: ${wamt(k, b[k])}"></a><span class="ico">${icon(W[k].icon)}</span><span class="amt">${wamt(k, b[k])}</span><span class="nm">${esc(W[k].name)}</span><small class="hide-s">${esc(wnote(k))}</small><div class="wfoot">${histBtn(k)}</div></div>`).join('')}</section>

        </div>
        <div class="card glow-gold">${head('Điều kiện cấp bậc', 'Khách hàng, Cộng tác viên, Đại lý')}${tierSteps(d, me, P, spent)}</div>
      </section>`;
    PSQ.donut($('#tvDonut'), { segments: e.total ? KIND.map(([k, , c]) => ({ value: e[k], color: c })).filter(s => s.value > 0) : [{ value: 1, color: 'rgba(255,255,255,.08)' }], center: short(e.total), sub: 'tổng hoa hồng', size: 160 });
  }

  function tierSteps(d, me, P, spent) {
    const tier = me.tier || 'khach', o = pkgOrder(d, me.id), left = Math.max(0, P.agentThreshold - spent);
    const ctvDone = tier !== 'khach', agDone = tier === 'daily';
    return `<div class="step" style="--c:${ADB.TIERS.ctv.color}"><span class="sdot">${icon(ctvDone ? 'check' : 'star')}</span>

        <span class="dim" style="font-size:13px">Kích hoạt gói ${money(P.pkgPrice)}</span>
        <ul><li>Nhận ${ps(P.pkgPoints)} vào ví mua hàng</li><li>Khóa học xây kênh và bán hàng online trị giá 5.000.000đ</li><li>Công cụ làm video hàng loạt và livestream đa nền tảng trị giá 15.000.000đ</li><li>Thưởng ${money(P.refBonus)} khi người mình giới thiệu kích hoạt CTV</li><li>Hoa hồng ${P.ctvRate}% đơn hàng của người mình giới thiệu</li></ul></div>
      <div class="step" style="--c:${ADB.TIERS.daily.color}"><span class="sdot">${icon(agDone ? 'check' : 'award')}</span>

      <div class="card glow-gold">${ranks.map(r => `<div class="rank-line"><span class="rank-gem" style="color:${r.color}">${icon('star')}</span><b style="color:${r.color}">${esc(r.name)}${r.id === L.rank.id ? ' <span class="badge gold">Hiện tại</span>' : ''}</b><span class="dim" style="font-size:13px">${r.minTeam ? 'Từ ' + r.minTeam + ' người, doanh số nhóm ' + short(r.minSales) : 'Khi tham gia'}${r.bonus ? ' · thưởng ' + r.bonus + '%' : ''} (mẫu)</span></div>`).join('')}</div></div>`;

  function pOrders(box, d, me) {

  /* ---------- VÍ ---------- */
  const WACT = { cash: [['deposit', 'Nạp tiền', 'plus'], ['topoints', 'Đổi sang điểm PS', 'gem'], ['withdraw', 'Rút về ngân hàng', 'download']], avail: [['transfer', 'Chuyển cho thành viên', 'users'], ['toshop', 'Sang ví mua hàng', 'bag']], sales: [['tocash', 'Rút sang ví tiền mặt', 'arrow']], bonus: [['convert', 'Chuyển sang ví khả dụng', 'arrow']], shop: [] };
  const GOLD = ['deposit', 'tocash', 'convert', 'transfer'];
  const byNewest = (x, y) => (y.date || '').localeCompare(x.date || '');
  function pWallet(box, d, me) {
    const b = ADB.balances(d, me.id), mine = (d.wallet || []).filter(w => w.user === me.id).sort(byNewest), P = ADB.plan(d);
    const held = k => -mine.filter(w => w.type === 'withdraw' && w.status === 'pending' && ADB.walletOf(w) === k).reduce((s, w) => s + w.amount, 0);
    box.innerHTML = ph('Ví của tôi', 'Ví tiền và ví hoa hồng tính bằng đồng, ba ví điểm tính bằng PS · 1đ = 1 PS · thuế thu nhập ' + P.taxRate + '% trừ khi rút hoa hồng và khi chuyển điểm thưởng') + note + `<section class="wgrid one-s">${WK.map(k => `<div class="wcard" style="--c:${W[k].color}"><span class="ico">${icon(W[k].icon)}</span><span class="amt">${wamt(k, b[k])}</span><span class="nm">${esc(W[k].name)}</span><small>${esc(wnote(k))}${held(k) ? `. Đang chờ rút ${wamt(k, held(k))}` : ''}</small>
        <div class="wfoot"><div class="acts">${WACT[k].map(([a, l, ic]) => `<button class="btn btn-sm${GOLD.includes(a) ? ' btn-gold' : ''}" type="button" data-wa="${a}">${icon(ic)} ${l}</button>`).join('') || `<button class="btn btn-sm" type="button" data-cart>${icon('cart')} Dùng khi đặt hàng</button>`}</div>${histBtn(k)}</div></div>`).join('')}</section>
      <div class="card glow-cyan mt-2">${head('Giao dịch gần đây', 'hoa hồng bán hàng, thưởng giới thiệu CTV, nạp và rút tiền', `<a class="card-link" href="#giao-dich">Xem tất cả</a>`)}${txTable(recentOf(mine).slice(0, 8))}</div>`;
  }
  // lịch sử từng ví, mới nhất trước, kèm số dư sau giao dịch
  function walletHist(k) {
    const d = ADB.load(), me = ADB.user(d, ME); if (!me || !W[k]) return;
    const rows = (d.wallet || []).map((w, i) => ({ w, i })).filter(({ w }) => w.user === me.id && ADB.walletOf(w) === k)
      .sort((x, y) => (x.w.date || '').localeCompare(y.w.date || '') || x.i - y.i);
    let run = 0; rows.forEach(r => { if (r.w.status === 'done' || (r.w.status === 'pending' && r.w.amount < 0)) run += r.w.amount; r.bal = run; });
    rows.reverse();
    const inn = rows.filter(r => r.w.amount > 0 && r.w.status === 'done').reduce((s, r) => s + r.w.amount, 0), out = -rows.filter(r => r.w.amount < 0 && r.w.status !== 'rejected').reduce((s, r) => s + r.w.amount, 0);
    const sg = n => `<b class="nowrap ${n < 0 ? 'red' : 'green'}">${n > 0 ? '+' : ''}${wamt(k, n)}</b>`;
    const md = modal(`<div class="card-head"><div><h3>Lịch sử ${esc(lower1(W[k].name))}</h3><div class="sub">${rows.length} giao dịch · mới nhất trước</div></div><button class="icon-btn" type="button" data-close style="margin-left:auto" aria-label="Đóng">${icon('close')}</button></div>
      <div class="wh-sum"><div><span>Số dư hiện tại</span><b style="color:${W[k].color}">${wamt(k, ADB.balances(d, me.id)[k])}</b></div><div><span>Tổng cộng vào</span><b class="green">${wamt(k, inn)}</b></div><div><span>Tổng trừ ra</span><b class="red">${wamt(k, out)}</b></div></div>
      ${rows.length ? `<div class="table-wrap"><table class="tbl wh-tbl"><thead><tr><th>Ngày</th><th>Loại</th><th>Nội dung</th><th>Số tiền</th><th>Số dư sau</th><th>Trạng thái</th></tr></thead><tbody>${rows.map(({ w, bal }) => `<tr${w.status === 'rejected' ? ' style="opacity:.6"' : ''}><td class="dim nowrap c-d">${fdate(w.date)}</td><td class="nowrap c-t">${esc(ADB.walletType[w.type] || w.type)}</td><td class="dim c-n" style="min-width:190px">${esc(w.note || '')}${w.type === 'tocash' && w.amount < 0 && w.tax ? `<br><small>Thuế ${money(w.tax)}, thực nhận ${money(w.net != null ? w.net : -w.amount - w.tax)}</small>` : ''}</td><td class="c-a">${sg(w.amount)}</td><td class="nowrap c-b">${wamt(k, bal)}</td><td class="c-s">${wB(w.status)}</td></tr>`).join('')}</tbody></table></div>`
        : `<div class="empty">${icon('clock')}Ví này chưa có giao dịch.</div>`}`);
    md.el.querySelector('.modal').classList.add('wh-modal');

  // cắt vuông ở giữa, thu về size px, JPEG 0,85
  function squareAvatar(file, size) {
    return new Promise((ok, fail) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        const s = Math.min(img.naturalWidth, img.naturalHeight); if (!s) { URL.revokeObjectURL(url); return fail(new Error('empty')); }
        const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
        g.fillStyle = '#0e1417'; g.fillRect(0, 0, size, size); g.imageSmoothingQuality = 'high';
        g.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
        URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => { URL.revokeObjectURL(url); fail(new Error('decode')); };
      img.src = url;
    });
  }

    const fr = $('#fr');
    if (fr) { const hint = () => { const c = fr.value.trim().toUpperCase(), sp = c && ADB.load().users.find(x => (x.code || '').toUpperCase() === c);
      $('#frHint').innerHTML = !c ? '' : sp ? `Người giới thiệu: <b class="gold">${esc(sp.name)}</b>` : '<span class="red">Mã giới thiệu chưa đúng, anh chị kiểm tra lại hoặc để trống.</span>'; };
      fr.addEventListener('input', hint); hint(); }
    const fu = $('#fu'), unameErr = v => !v ? '' : !UNAME.test(v) ? 'Tên truy cập dài 3 đến 30 ký tự, chỉ gồm a-z, 0-9, dấu chấm, gạch dưới.' : unameTaken(ADB.load(), v, null) ? 'Tên truy cập này đã có người dùng.' : '';
    if (fu) fu.addEventListener('input', () => { const v = fu.value.trim().toLowerCase(), er = unameErr(v);
      $('#fuHint').innerHTML = !v ? 'Chữ thường không dấu, số, dấu chấm hoặc gạch dưới. Để trống thì hệ thống tự tạo.' : er ? `<span class="red">${er}</span>` : `<span class="green">Dùng được: @${esc(v)}</span>`; });
    // điều khoản: phải kéo đọc tới cuối thì ô đồng ý mới bấm được
    const tm = $('#terms'); if (tm) { const ag = $('#agree'), seen = () => { if (tm.scrollTop + tm.clientHeight >= tm.scrollHeight - 12) { ag.disabled = false; $('#termsBox').classList.add('end'); $('#termsHint').textContent = 'Đã đọc hết ✓'; $('#termsHint').classList.add('green'); tm.removeEventListener('scroll', seen); } }; tm.addEventListener('scroll', seen, { passive: true }); seen(); }
    $('#af').addEventListener('submit', e => {
      e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)), err = $('#err');
      let wanted;
      if (mode === 'register') {
        if (!f.name || !f.email || !f.pass) return err.textContent = 'Anh chị điền đủ họ tên, email và mật khẩu.';
        wanted = (f.username || '').trim().toLowerCase(); const ue = unameErr(wanted); if (ue) return err.textContent = ue;
        if (f.pass.length < 6) return err.textContent = 'Mật khẩu tối thiểu 6 ký tự.';
        if (!f.agree) return err.textContent = 'Anh chị cần đồng ý với điều khoản.';
      }
      const r = mode === 'login' ? auth.login(f.email, f.pass) : auth.register(f);
      if (r.error) return err.textContent = r.error;
      if (mode === 'register') ensureMember(r.user.id, wanted || '');
      location.href = 'thanh-vien.html' + (mode === 'register' ? '#tong-quan' : location.hash);
    });
  }

  ADB.load(); // bổ sung dữ liệu kế hoạch trả thưởng (chạy thử)
  const u = auth.user();
  if (u) { ME = u.id; ensureMember(u.id); member(); }
  else guest(PSQ.qs('dang-ky') || refCode ? 'register' : 'login');
})();
</script>
</body>
</html>
